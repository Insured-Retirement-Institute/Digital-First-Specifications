<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IRI API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
    <link rel="stylesheet" type="text/css" href="./css/custom.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
</head>
<body class="api-viewer-page">
    <header class="site-header">
        <div class="container">
            <nav class="api-selector-nav">
                <div class="selector-group">
                    <label for="api-selector">API:</label>
                    <select id="api-selector" onchange="onApiChange()">
                        <option value="appstatus">Application Status API</option>
                        <option value="appstatuspushNotifications">Application Status Push Notifications API</option>
                        <option value="producertraining">Producer Training Update</option>
                        <option value="activatedannuityincome">Activated Annuity Income API</option>
                        <option value="onetimewithdrawal">One-Time Withdrawals API</option>
                        <option value="onetimewithdrawalquote">One-Time Withdrawal Quote API</option>
                        <option value="systematicwithdrawalprogramsetup">Systematic Withdrawal Program Setup API</option>
                        <option value="systematicwithdrawalprogramupdate">Systematic Withdrawal Program Update API</option>
                        <option value="paperlessreplacements">Paperless Replacements (RPL) API</option>
                        <option value="fundtransfer">Fund Transfer API</option>
                        <option value="policyinquiry">Policy Inquiry API</option>
                        <option value="beneficiaryreplacement">Beneficiary Replacement API</option>
                        <option value="documentprocessing">Document Processing API</option>
                        <option value="cedingdata">Ceding Data API</option>
                        <!-- Add more options as you add more APIs -->
                    </select>
                </div>
                <div class="selector-group">
                    <label for="version-selector">Version:</label>
                    <select id="version-selector" class="version-selector" onchange="loadSelectedAPI()">
                        <!-- Versions will be populated dynamically if available -->
                        <option value="v1">v1.0.0</option>
                    </select>
                </div>
                <a href="index.html" class="btn btn-secondary">Back to API Catalog</a>
            </nav>
        </div>
    </header>

    <div id="swagger-ui"></div>

    <!-- Swagger UI Bundle -->
    <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <!-- Reads YAML files for combined views (see "parts" below) -->
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js" charset="UTF-8"></script>
    <script>
        // API keys are opaque catalog IDs (not filenames). Spec files are under versions.*.path.
        // Order the specs from oldest to newest as the last version is the default in the dropdown.
        const apiDefinitions = {
            "appstatus": {
                name: "Application Status API",
                versions: {
                    "v1": {
                        path: "specs/appstatusv1.yaml",
                        displayName: "v1.0.0"
                    },
                    "v2": {
                        path: "specs/appstatusv2.yaml",
                        displayName: "v2.0.0"
                    },
                    "v3": {
                        path: "specs/appstatus_3.1.0.yaml",
                        displayName: "v3.1.0"
                    },
                    "v4": {
                        path: "specs/appstatus_4.0.0.yaml",
                        displayName: "v4.0.0"
                    }
                }
            },
            "appstatuspushNotifications": {
                name: "Application Status Push Notifications API",
                versions: {
                    "v1": {
                        path: "specs/appstatuspushNotifications_1.1.1.yaml",
                        displayName: "v1.1.1"
                    },
                    "v2": {
                        path: "specs/appstatuspushNotifications_2.0.0.yaml",
                        displayName: "v2.0.0"
                    }
                }
            },
            "producertraining": {
                name: "Producer Training Update",
                versions: {
                    "v1": {
                        path: "specs/producertraining_1.0.1.yaml",
                        displayName: "v1.0.1"
                    }
                }
            },
            "activatedannuityincome": {
                name: "Activated Annuity Income API",
                versions: {
                    "v1": {
                        path: "specs/activatedannuityincome_1.0.1.yaml",
                        displayName: "v1.0.1"
                    }
                }
            },
            "onetimewithdrawal": {
                name: "One-Time Withdrawals API",
                versions: {
                    "v1": {
                        path: "specs/onetimewithdrawal_1.0.1.yaml",
                        displayName: "v1.0.1"
                    },
                    "v2": {
                        path: "specs/onetimewithdrawal_2.0.1.yaml",
                        displayName: "v2.0.1"
                    }
                }
            },
            "onetimewithdrawalquote": {
                name: "One-Time Withdrawal Quote API",
                versions: {
                    "v1": {
                        path: "specs/onetimewithdrawalquote_1.0.1.yaml",
                        displayName: "v1.0.1"
                    },
                    "v2": {
                        path: "specs/onetimewithdrawalquote_2.0.1.yaml",
                        displayName: "v2.0.1"
                    }
                }
            },
            "systematicwithdrawalprogramsetup": {
                name: "Systematic Withdrawal Program Setup API",
                versions: {
                    "v1": {
                        path: "specs/systematicwithdrawalprogramsetup_1.0.1.yaml",
                        displayName: "v1.0.1"
                    },
                    "v2": {
                        path: "specs/SystematicProgramSetUp_2.0.0.yml",
                        displayName: "v2.0.0"
                    }
                }
            },
            "systematicwithdrawalprogramupdate": {
                name: "Systematic Withdrawal Program Update API",
                versions: {
                    "v1": {
                        path: "specs/systematicwithdrawalprogramupdate_1.0.1.yaml",
                        displayName: "v1.0.1"
                    },
                    "v2": {
                        path: "specs/SystematicProgramUpdate_2.0.0.yml",
                        displayName: "v2.0.0"
                    }
                }
            },
            "paperlessreplacements": {
                name: "Paperless Replacements (RPL) API",
                versions: {
                    "v1": {
                        path: "specs/paperlessreplacements1.yaml",
                        displayName: "v1.0.0"
                    }
                }
            },
            "fundtransfer": {
                name: "Fund Transfer API",
                versions: {
                    "v1": {
                        path: "specs/fundtransfer_1.0.1.yaml",
                        displayName: "v1.0.1"
                    },
                    "v2": {
                        path: "specs/FundTransfer_2.0.0.yml",
                        displayName: "v2.0.0"
                    }
                }
            },
            "policyinquiry": {
                name: "Policy Inquiry API",
                versions: {
                    "v1": {
                        path: "specs/policyinquiry.yaml",
                        displayName: "v1.0.0"
                    },
                    "v2": {
                        path: "specs/policyinquiry_2.1.1.yaml",
                        displayName: "v2.1.1"
                    }
                }
            },
            "beneficiaryreplacement": {
                name: "Beneficiary Replacement API",
                versions: {
                    "v1": {
                        path: "specs/beneficiaryreplacement_1.0.0.yaml",
                        displayName: "v1.0.0"
                    }
                }
            },
            "documentprocessing": {
                name: "Document Processing API",
                versions: {
                    "v1": {
                        path: "specs/DocumentProcessing_1.0.0.yaml",
                        displayName: "v1.0.0"
                    }
                }
            },
            // Combined view: lists several separate spec files on one page.
            // Each file stays its own API and is shown as a numbered step, in the order listed.
            // The YAML files themselves are not changed.
            "cedingdata": {
                name: "Ceding Data API",
                versions: {
                    "v1": {
                        displayName: "v1.0.0",
                        title: "Ceding Data",
                        description: "Ceding Data is made up of **two separate APIs** that are called in order " +
                            "when completing a replacement within the order entry process:\n\n" +
                            "1. **Ceding Carrier Data API** — call this first to verify that the distributor is " +
                            "affiliated with the ceding policy at the ceding carrier.\n" +
                            "2. **Ceding Policy Data API** — call this second, after verification succeeds, to " +
                            "retrieve the ceding policy's details.\n\n" +
                            "Each API keeps its own specification file:",
                        parts: [
                            {
                                path: "specs/cedingcarrier_1.0.0.yml",
                                label: "Step 1: Ceding Carrier Data API"
                            },
                            {
                                path: "specs/cedingpolicy_1.0.0.yml",
                                label: "Step 2: Ceding Policy Data API"
                            }
                        ]
                    }
                }
            }
        };
        // Add more APIs to the end of the object above as you add more APIs

        // Accept legacy ?api=foo.yaml bookmarks by stripping the suffix.
        function resolveApiKey(apiParam) {
            if (!apiParam) return null;
            if (apiDefinitions[apiParam]) return apiParam;
            // Old Ceding Carrier / Ceding Policy links now open the combined Ceding Data page.
            if (apiParam === 'cedingcarrier' || apiParam === 'cedingpolicy') return 'cedingdata';
            if (apiParam.endsWith('.yaml')) {
                const withoutSuffix = apiParam.slice(0, -5);
                if (apiDefinitions[withoutSuffix]) return withoutSuffix;
            }
            return null;
        }

        // Rebuild the Version dropdown for the given API key from apiDefinitions above.
        // Options are inserted in object-key order (convention: oldest → newest).
        // Hides the Version control entirely when the API has only one version.
        function populateVersionSelector(apiKey) {
            const versionSelector = document.getElementById('version-selector');
            versionSelector.innerHTML = '';

            const api = apiDefinitions[apiKey];
            if (api && api.versions) {
                const versions = api.versions;
                Object.keys(versions).forEach(versionKey => {
                    const option = document.createElement('option');
                    option.value = versionKey;
                    option.textContent = versions[versionKey].displayName;
                    versionSelector.appendChild(option);
                });
                const versionSelectorGroup = versionSelector.closest('.selector-group');
                versionSelectorGroup.style.display = Object.keys(versions).length > 1 ? 'flex' : 'none';
            }
        }

        // API selectordropdown onchange handler. Must rebuild versions before loading —
        // otherwise the Version dropdown still holds the previous API's version key
        // (e.g. "v3"), the lookup fails, and Swagger tries to fetch the raw API key.
        // After rebuilding, select the last option (newest) then load that spec.
        function onApiChange() {
            const selectedAPI = document.getElementById('api-selector').value;
            populateVersionSelector(selectedAPI);

            // Prefer the newest version (last key; versions are listed oldest → newest).
            const versionSelector = document.getElementById('version-selector');
            if (versionSelector.options.length > 0) {
                versionSelector.selectedIndex = versionSelector.options.length - 1;
            }

            loadSelectedAPI();
        }

        // Loads each spec file listed in "parts" and shows them together on one page.
        // Every file keeps its own endpoints, models and security settings; only the display is combined.
        async function buildCombinedSpec(def) {
            const HTTP_METHODS = ['get', 'put', 'post', 'delete', 'options', 'head', 'patch', 'trace'];
            const texts = await Promise.all(def.parts.map(part =>
                fetch(part.path).then(r => {
                    if (!r.ok) throw new Error('Could not load ' + part.path);
                    return r.text();
                })
            ));
            const specs = texts.map(t => jsyaml.load(t));

            const fileLinks = def.parts.map((part, i) =>
                '- ' + part.label + ' (version ' + specs[i].info.version + '): [' +
                part.path.split('/').pop() + '](' + part.path + ')').join('\n');

            const combined = {
                openapi: specs[0].openapi,
                info: {
                    title: def.title,
                    version: def.displayName.replace(/^v/, ''),
                    description: def.description + '\n\n' + fileLinks,
                    license: specs[0].info.license
                },
                tags: [],
                paths: {},
                components: {}
            };

            specs.forEach((spec, i) => {
                const part = def.parts[i];
                combined.tags.push({ name: part.label, description: spec.info.description || '' });

                // Merge components. If two files use the same name for something different,
                // the later one is renamed (e.g. oauth2_2) so each API keeps its own definition.
                const renamedSchemes = {};
                Object.entries(spec.components || {}).forEach(([section, items]) => {
                    combined.components[section] = combined.components[section] || {};
                    Object.entries(items).forEach(([name, value]) => {
                        const existing = combined.components[section][name];
                        if (existing === undefined) {
                            combined.components[section][name] = value;
                        } else if (JSON.stringify(existing) !== JSON.stringify(value)) {
                            const newName = name + '_' + (i + 1);
                            if (section !== 'securitySchemes') {
                                console.warn('Name conflict in ' + section + '.' + name + ' (' + part.path + ')');
                            }
                            combined.components[section][newName] = value;
                            if (section === 'securitySchemes') renamedSchemes[name] = newName;
                        }
                    });
                });

                // Security set at the top of a file is applied to that file's own endpoints only.
                const renameSecurity = sec => (sec || []).map(req => {
                    const out = {};
                    Object.entries(req).forEach(([k, v]) => { out[renamedSchemes[k] || k] = v; });
                    return out;
                });

                Object.entries(spec.paths || {}).forEach(([path, item]) => {
                    if (combined.paths[path]) console.warn('Duplicate path ' + path + ' in ' + part.path);
                    HTTP_METHODS.forEach(method => {
                        const op = item[method];
                        if (!op) return;
                        op.tags = [part.label];
                        op.security = renameSecurity(op.security || spec.security);
                    });
                    combined.paths[path] = item;
                });
            });

            return combined;
        }

        function loadSelectedAPI() {
            const apiSelector = document.getElementById('api-selector');
            const versionSelector = document.getElementById('version-selector');
            const selectedAPI = apiSelector.value;
            const selectedVersion = versionSelector.value;

            const versionDef = apiDefinitions[selectedAPI]?.versions[selectedVersion];
            const apiPath = versionDef?.path || selectedAPI;

            // Update URL for bookmarking/sharing
            const url = new URL(window.location);
            url.searchParams.set('api', selectedAPI);
            url.searchParams.set('version', selectedVersion);
            window.history.pushState({}, '', url);

            const swaggerOptions = {
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                displayRequestDuration: true,
                defaultModelsExpandDepth: -1,
                defaultModelRendering: 'example',
                defaultModelExpandDepth: 10,
                filter: true
            };

            if (versionDef?.parts) {
                buildCombinedSpec(versionDef)
                    .then(spec => { window.ui = SwaggerUIBundle({ ...swaggerOptions, spec: spec }); })
                    .catch(err => {
                        document.getElementById('swagger-ui').innerHTML =
                            '<p style="padding:2rem">Unable to load this API: ' + err.message + '</p>';
                    });
            } else {
                window.ui = SwaggerUIBundle({ ...swaggerOptions, url: apiPath });
            }
        }

        // Initial setup
        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            const apiParam = urlParams.get('api');
            const versionParam = urlParams.get('version');

            const apiSelector = document.getElementById('api-selector');
            const resolvedApi = resolveApiKey(apiParam);

            if (resolvedApi) {
                apiSelector.value = resolvedApi;
            }

            const selectedAPI = apiSelector.value;
            populateVersionSelector(selectedAPI);

            const versionSelector = document.getElementById('version-selector');

            // If version is specified in URL and exists for the selected API
            if (versionParam && apiDefinitions[selectedAPI]?.versions[versionParam]) {
                versionSelector.value = versionParam;
            } else if (versionSelector.options.length > 0) {
                // Default to newest when URL has no usable version
                versionSelector.selectedIndex = versionSelector.options.length - 1;
            }

            loadSelectedAPI();
        };
    </script>
</body>
</html>
