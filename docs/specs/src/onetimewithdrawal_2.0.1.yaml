    Day2WithdrawalConfirmationEvent:
      x-event-mesh:
        broker: "SAP Advanced Event Mesh / Solace"
        topicPattern: "{root}/ift/v1/{eventType}/{status}/{transactionType}/{firm}"
        deliveryModel: "topic-subscription"
        asyncApiSpec: "./asyncapi/OneTimeWithdrawal_Day2_v1.5.yaml"
        note: "Delivered over a message broker via topic subscription, not an HTTP callback. A companion AsyncAPI document is the machine-readable contract; this extension exists for interim discoverability.\n"
      type: "object"
      description: "Canonical Day-2 withdrawal confirmation event published to the enterprise event mesh after a one-time withdrawal request completes processing.\n"
      required:
        - "eventType"
        - "eventId"
        - "eventTimestamp"
        - "associatedFirmId"
        - "requestId"
        - "policyNumber"
        - "transactionType"
        - "status"
        - "transExeDate"
        - "transExeTime"
        - "nsccParticipantId"
        - "npn"
        - "correlationId"
      properties:
        eventType:
          type: "string"
          description: "Identifies the type of Day-2 confirmation event published to the event mesh.\ \n"
          enum:
            - "day2confirm"
        eventId:
          type: "string"
          maxLength: 36
          format: "uuid"
          description: "Globally unique identifier for this event. Used by consuming systems for idempotent processing and duplicate detection.\n"
        eventTimestamp:
          type: "string"
          format: "date-time"
          description: "Date and time when the event was published to the event mesh.\n"
        associatedFirmId:
          type: "string"
          maxLength: 65
          description: "Firm identifier associated with the transaction. Populated by the integration platform as part of event enrichment.\n"
        requestId:
          type: "string"
          description: "Identifier assigned when the withdrawal request was submitted. Used to correlate the Day-2 confirmation with the original Day-1 request.\n"
        correlationId:
          type: "string"
          maxLength: 100
          description: "Optional client-supplied identifier to trace the request."
        policyNumber:
          type: "string"
          minLength: 1
          maxLength: 30
          description: "Policy number"
        transactionType:
          type: "string"
          enum:
            - "one-time-partials"
            - "full-surrenders"
          description: "High-level classification of the transaction that completed processing.\n"
        transactionSubType:
          type: "string"
          description: "Optional subtype of the transaction, when applicable (for example, RMD or interest-only).\n"
          enum:
            - "specified-withdrawal"
            - "surrender-free"
            - "rider-free"
            - "interest-only"
            - "rmd"
        status:
          type: "string"
          description: "Final processing outcome of the withdrawal request.\n"
          enum:
            - "SUCCESS"
            - "SUCCESS_WITH_INFO"
            - "FAILURE"
        message:
          type: "string"
          description: "Human-readable explanation of the outcome. Populated when the transaction fails or additional explanation is required.\n"
        effectiveDate:
          type: "string"
          format: "date"
          description: "Effective date of the withdrawal on the policy, when applicable.\n"
        npn:
          type: "string"
          maxLength: 100
          description: "The unique National Producer Number that is assigned to an individual producer at the NAIC level that is used as the standard global identifier across all states."
        nsccParticipantId:
          type: "string"
          maxLength: 100
          description: "Unique identifier for the submitting firm or participant within the NSCC network."
        transExeDate:
          type: "string"
          format: "date"
          description: "Date on which the Day‑2 confirmation was produced by the transaction processing system.\n"
        transExeTime:
          type: "string"
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          description: "Time on which the Day-2 confirmation was produced by the transaction processing system.\n"
