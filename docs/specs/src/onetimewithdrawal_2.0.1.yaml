# TODO: align to shared Error_v1 — see ERROR-SCHEMA-DEBT.md
openapi: "3.1.0"
info:
  title: "One-Time Withdrawal API (Full Surrender and Partial Withdrawal(including RMD))"
  version: "2.0.1"
  description: "API to submit one-time withdrawals (Partial, Full, and RMD) on a policy. Supported transaction types: oneTimePartialWithdrawal, fullSurrender.\n"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
paths:
  /v1/policies/{policyNumber}/withdrawal-requests/one-time-partials:
    post:
      operationId: "submitOneTimeWithdrawal"
      tags:
        - "One Time Partial Withdrawal Request"
      description: "Submit a one-time partial withdrawal. Select rmd as a transactionSubType for One Time RMD request.\n"
      parameters:
        - $ref: "#/components/parameters/PolicyNumber"
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/TransactionSubType"
        - $ref: "#/components/parameters/AssociatedFirmId"
      x-business-rule:
        rmd:
          when:
            transactionSubType: "rmd"
          require:
            - "$.rmdInfo"
        nonRmd:
          when:
            transactionSubType:
              not:
                in:
                  - "rmd"
          constraints:
            - name: "forbid-rmdInfo-when-not-rmd"
              description: "When transactionSubType is not RMD, rmdInfo must be omitted to avoid ambiguous payloads."
              assert: "$.rmdInfo == null"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimePartialWithdrawalRequest"
            examples:
              OneTimePartialWithdrawal_RMD_Example:
                summary: "Partial Withdrawal RMD subtype"
                value:
                  effectiveDate: "2025-03-01"
                  nsccParticipantId: "NSCC888"
                  cusip: "0275IFOW4"
                  producer:
                    producerNumber: "PROD888"
                    npn: "1111111111"
                    crdNumber: "2222222222"
                  transactionAmounts:
                    requestedAmount: 750
                    amountType: "AMOUNT"
                    disbursementType: "NET"
                    disbursementPaymentForm: "ACH"
                  allocationOption: "PRORATA"
                  fundDistributions:
                    - fundId: "FUND-RMD1"
                      fundName: "Balanced Fund"
                      totalFundValue: null
                      requestedAmount: null
                    - fundId: "FUND-RMD2"
                      fundName: "Equity Fund"
                      totalFundValue: null
                      requestedAmount: null
                  rmdInfo:
                    rmdTaxYear: 2025
                    rmdAgeAtDistribution: 72
                    rmdSpouseDoB: "1953-05-10"
                    rmdRequestedAmount: 750
                    rmdCalculationMethod: "UNIFORM_LIFETIME_TABLE"
                    rmdPriorYearEndValue: 80000
                  payeeOrBeneficiary:
                    - paymentForm: "ACH"
                      allocationPercentage: 100
                      party:
                        taxId: "123456789"
                        firstName: "Morgan"
                        middleName: "B"
                        lastName: "Lee"
                        type: "individual"
                        bank:
                          bankId: "Bank_RMD"
                          nameOnAccount: "Morgan Lee"
                          accountStatus: "ACTIVEBANKACCOUNT"
                          accountType: "CHECKING"
                          accountNumber: "123123123"
                          routingNumber: "321321321"
                          branchName: "Downtown Branch"
                        address:
                          addressId: "Addr_RMD"
                          addressType: "RESIDENCE"
                          addressLine1: "300 Elm St"
                          addressLine2: "Unit 5"
                          addressLine3: "Bldg A"
                          city: "Chicago"
                          state: "IL"
                          zipCode: "60601"
                          zipCodeExtension: "1234"
                          country: "US"
                  parties:
                    - taxId: "123456789"
                      firstName: "Morgan"
                      middleName: "B"
                      lastName: "Lee"
                      type: "individual"
                      relationships:
                        - "owner"
                      paymentForm: "ACH"
                      allocationPercentage: 100
                      bank:
                        bankId: "Bank_RMD"
                        nameOnAccount: "Morgan Lee"
                        accountStatus: "ACTIVEBANKACCOUNT"
                        accountType: "CHECKING"
                        accountNumber: "123123123"
                        routingNumber: "321321321"
                        branchName: "Downtown Branch"
                      address:
                        addressId: "Addr_RMD"
                        addressType: "RESIDENCE"
                        addressLine1: "300 Elm St"
                        addressLine2: "Unit 5"
                        addressLine3: "Bldg A"
                        addressLine4: "String"
                        addressLine5: "String"
                        city: "Chicago"
                        state: "IL"
                        zipCode: "60601"
                        zipCodeExtension: "1234"
                        country: "US"
                  taxWithholdingInstructions:
                    - party:
                        taxId: "123456789"
                        firstName: "Morgan"
                        middleName: "B"
                        lastName: "Lee"
                        type: "individual"
                      taxWithholdingType: "FEDERAL"
                      taxRateToUse: "USEVALUESENTERED"
                      filingStatus: "SINGLE"
                      dollar: 15
                  charges:
                    - chargeType: "WITHDRAWALCHARGE"
                      isChargeWaived: false
