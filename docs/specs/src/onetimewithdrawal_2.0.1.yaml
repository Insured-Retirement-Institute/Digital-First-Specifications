                          addressLine5: "String"
                          city: "San Francisco"
                          state: "CA"
                          zipCode: "94102"
                          zipCodeExtension: "5555"
                          country: "US"
                  parties:
                    - taxId: "123456789"
                      firstName: "Jordan"
                      middleName: "C"
                      lastName: "Kim"
                      type: "individual"
                      relationships:
                        - "owner"
                      paymentForm: "CHECK"
                      allocationPercentage: 100
                      bank:
                        bankId: "Bank_NRMD"
                        nameOnAccount: "Jordan Kim"
                        accountStatus: "ACTIVEBANKACCOUNT"
                        accountType: "CHECKING"
                        accountNumber: "555666777"
                        routingNumber: "111222333"
                        branchName: "Uptown Branch"
                      address:
                        addressId: "Addr_NRMD"
                        addressType: "RESIDENCE"
                        addressLine1: "400 Oak St"
                        addressLine2: "Apt 2"
                        addressLine3: "Bldg B"
                        addressLine4: "String"
                        addressLine5: "String"
                        city: "San Francisco"
                        state: "CA"
                        zipCode: "94102"
                        zipCodeExtension: "5555"
                        country: "US"
                  taxWithholdingInstructions:
                    - party:
                        taxId: "123456789"
                        firstName: "Jordan"
                        middleName: "C"
                        lastName: "Kim"
                        type: "individual"
                      taxWithholdingType: "STATE"
                      taxRateToUse: "USEVALUESENTERED"
                      filingStatus: "SINGLE"
                      dollar: 15
                      taxJurisdiction: "USA"
                  charges:
                    - chargeType: "WITHDRAWALCHARGE"
                      isChargeWaived: true
                      chargeWaiverReason: "PROMO"
                  isOverride: true
      responses:
        "201":
          description: "Created — withdrawal request accepted for processing."
          headers:
            Location:
              description: "URL of the created arrangement resource. Format: /v1/policies/{policyNumber}/withdrawal-requests/{requestId}\n"
              schema:
                type: "string"
                format: "uri"
            correlationId:
              description: "Optional client-supplied identifier to trace the request."
              $ref: "#/components/headers/correlationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequestStatus"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeError"
        "422":
          $ref: "#/components/responses/UnprocessableEntityError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGatewayError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "504":
          $ref: "#/components/responses/GatewayTimeoutError"
  /v1/policies/{policyNumber}/withdrawal-requests/full-surrenders:
    post:
