    IndividualParty:
      description: "Schema for individual party data"
      type: "object"
      allOf:
        - $ref: "#/components/schemas/IndividualIdentity"
        - $ref: "#/components/schemas/PartyRelationship"
    EntityParty:
      description: "Schema for entity party data"
      type: "object"
      allOf:
        - $ref: "#/components/schemas/EntityIdentity"
        - $ref: "#/components/schemas/PartyRelationship"
    IndividualIdentity:
      $ref: "${SHARED_SPECS_BASE}/IndividualIdentity_v1.yaml#/components/schemas/IndividualIdentity"
    PartyRelationship:
      $ref: "${SHARED_SPECS_BASE}/PartyRelationship_v1.yaml#/components/schemas/PartyRelationship"
    EntityIdentity:
      $ref: "${SHARED_SPECS_BASE}/EntityIdentity_v1.yaml#/components/schemas/EntityIdentity"
    RmdInfo:
      type: "object"
      description: "Provides Required Minimum Distribution (RMD) details for the withdrawal.

        Special Behavior: - This object is conditionally required based on `transactionSubType`.

        Rules: - MUST be provided when `transactionSubType = rmd` - MUST NOT be provided for any non-RMD transaction

        Notes: - This object enables regulatory compliance for IRS RMD rules. - Incorrect usage (missing or extraneous inclusion) will cause request validation failure.\n"
      properties:
        rmdTaxYear:
          description: "The tax year this RMD withdrawal is for (for example, 2025). Used to decide which year's RMD requirement the withdrawal is satisfying.\n"
          type: "integer"
          minimum: 1900
          maximum: 2100
        rmdAgeAtDistribution:
          description: "The age of the RMD owner on the distribution date, in whole years. If not sent, the carrier or platform may calculate it from date of birth.\n"
          type: "integer"
          minimum: 0
          maximum: 150
        rmdSpouseDoB:
          description: "The date of birth of the spouse of owner/annuitant."
          type: "string"
          format: "date"
        rmdRequestedAmount:
          description: "The portion of this withdrawal that should count toward RMD for rmdTaxYear. In many cases this will match transactionAmounts.requestedAmount when the entire withdrawal is intended to satisfy RMD.\n"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        rmdCalculationMethod:
          description: "The method or IRS table used to calculate the RMD. Used mainly for audit/explanation."
          type: "string"
          enum:
            - "UNIFORM_LIFETIME_TABLE"
            - "JOINT_LIFE"
            - "SINGLE_LIFE"
            - "OTHER"
        rmdPriorYearEndValue:
          description: "The contract value as of 12/31 of the prior year used as the base for RMD calculation. Including this allows downstream systems to re-check or explain the RMD math.\n"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
      required:
        - "rmdTaxYear"
        - "rmdRequestedAmount"
        - "rmdCalculationMethod"
    OneTimePartialWithdrawalRequest:
      type: "object"
      description: "Represents a one-time partial withdrawal request, including standard withdrawals

        \  and Required Minimum Distributions (RMD).


        \  Special Behavior:

        \  - This schema is governed by external business rules defined via `transactionSubType`.

        \  - Conditional validation is applied based on the subtype of the transaction.


        \  Rules:

        \  - When `transactionSubType = rmd`:

        \    - `rmdInfo` is REQUIRED

        \    - `transactionAmounts.requestedAmount` typically aligns with RMD calculation

        \  - When `transactionSubType ≠ rmd`:

        \    - `rmdInfo` MUST NOT be provided\n"
      properties:
        effectiveDate:
          description: "When the transaction was originally scheduled or expected to happen, can be a non-business day."
          type: "string"
          format: "date"
        nsccParticipantId:
          description: "Unique identifier for the submitting firm or participant within the NSCC network."
          type: "string"
          maxLength: 100
        cusip:
          type: "string"
          minLength: 9
          maxLength: 9
          pattern: "^[0-9]{3}[A-Z0-9]{5}[0-9]$"
          description: "CUSIP"
        producer:
          description: "Licensed producer information"
          $ref: "#/components/schemas/Producer"
        transactionAmounts:
          description: "Details of financial amounts associated with the transaction."
          $ref: "#/components/schemas/TransactionAmounts"
        allocationOption:
          type: "string"
          enum:
            - "PRORATA"
            - "DOLLAR"
            - "SPECIFYPERCENTAGE"
            - "SPECIFIEDFUNDS"
            - "SPECIFIEDSEGMENTS"
            - "DEFAULT"
            - "PECKINGORDER"
            - "EARNINGSONLY"
          description: "Defines the format of how the funds are removed"
        fundDistributions:
          description: "Detailed allocation of funds."
          type: "array"
          items:
            $ref: "#/components/schemas/FundDistribution"
        rmdInfo:
          description: "When transactionSubType = rmd, the rmdInfo object is required for the request. When transactionSubType is not rmd, the rmdInfo object must not be present in the request payload.\n"
          $ref: "#/components/schemas/RmdInfo"
        payeeOrBeneficiary:
          description: "The payeeOrBeneficiary object represents how the withdrawal proceeds are distributed and to whom. It includes payment form, allocation rules for each payee.\n"
          type: "array"
          items:
            $ref: "#/components/schemas/PayeeOrBeneficiary"
        parties:
          description: "The parties object represents the policy parties relevant to the withdrawal (owners, annuitants, beneficiaries, etc.), along with their identity, relationship, and payout instructions.\n"
          type: "array"
          items:
            $ref: "#/components/schemas/Party"
        taxWithholdingInstructions:
          description: "List of tax withholding instruction entries."
          type: "array"
          items:
            $ref: "#/components/schemas/TaxWithholdingInstruction"
        charges:
          description: "List of charges (fees and deductions) applied to the transaction."
          type: "array"
          items:
            $ref: "#/components/schemas/Charges"
        isOverride:
          description: "Override rules if true"
          type: "boolean"
      required:
        - "effectiveDate"
        - "cusip"
        - "allocationOption"
        - "nsccParticipantId"
        - "producer"
      allOf:
        - if:
            properties:
              allocationOption:
                const: "SPECIFIEDFUNDS"
              transactionAmounts:
                type: "object"
                properties:
                  amountType:
                    description: "Indicates the method used to calculate the transfer value, such as a specified dollar amount, a percentage of contract value, or a full rebalance. This value drives how amounts are specified throughout the transaction."
                    const: "PERCENTAGE"
                required:
                  - "amountType"
            required:
              - "allocationOption"
              - "transactionAmounts"
          then:
            required:
              - "fundDistributions"
            properties:
              fundDistributions:
                type: "array"
                items:
                  allOf:
                    - $ref: "#/components/schemas/FundDistribution"
                    - type: "object"
                      required:
                        - "requestedPercentage"
                    - not:
                        required:
                          - "requestedAmount"
        - if:
            properties:
              allocationOption:
                const: "SPECIFIEDFUNDS"
              transactionAmounts:
                type: "object"
                properties:
                  amountType:
                    description: "Specifies how the withdrawal amount is provided by the user. For example as a dollar amount, a percentage, or the maximum allowed amount."
                    const: "AMOUNT"
                required:
                  - "amountType"
            required:
              - "allocationOption"
              - "transactionAmounts"
          then:
            required:
              - "fundDistributions"
            properties:
              fundDistributions:
                type: "array"
                items:
                  allOf:
                    - $ref: "#/components/schemas/FundDistribution"
                    - type: "object"
                      required:
                        - "requestedAmount"
                    - not:
                        required:
                          - "requestedPercentage"
