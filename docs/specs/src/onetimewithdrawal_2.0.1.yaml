  /v1/policies/{policyNumber}/withdrawal-requests/{requestId}:
    get:
      operationId: "getWithdrawalRequest"
      tags:
        - "Withdrawal Request Lifecycle"
      description: "Retrieve the current processing status of a previously submitted withdrawal request. This endpoint allows clients to poll for status updates until the transaction reaches a final outcome.\n"
      parameters:
        - $ref: "#/components/parameters/PolicyNumber"
        - name: "requestId"
          in: "path"
          required: true
          description: "Identifier returned in the Location header from the Withdrawal request POST.\n"
          schema:
            type: "string"
      responses:
        "200":
          description: "Withdrawal request resource."
          headers:
            correlationId:
              description: "Optional client-supplied identifier to trace the request."
              $ref: "#/components/headers/correlationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetWithdrawalRequestStatus"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    PolicyNumber:
      $ref: "${SHARED_SPECS_BASE}/PolicyNumber_v1.yaml#/components/parameters/PolicyNumber"
    CorrelationIdHeader:
      $ref: "${SHARED_SPECS_BASE}/CorrelationIdHeader_v1.yaml#/components/parameters/CorrelationIdHeader"
    TransactionSubType:
      name: "transactionSubType"
      in: "query"
      required: true
      description: "Indicates the business context and validation rules for the withdrawal request. This field drives conditional payload requirements and processing logic.

        Special Behavior: - The value of `transactionSubType` determines whether additional fields

        \  (such as `rmdInfo`) are required or must be omitted.


        Values: - specified-withdrawal: Standard partial withdrawal - surrender-free: Withdrawal within free limits - rider-free: Withdrawal covered under rider benefits - interest-only: Withdrawal limited to earned interest - rmd: Required Minimum Distribution (RMD)

        Rules: - When transactionSubType = rmd:

        \  - `rmdInfo` MUST be provided in the request body

        - When transactionSubType ≠ rmd:

        \  - `rmdInfo` MUST NOT be present\n"
      schema:
        type: "string"
        enum:
          - "specified-withdrawal"
          - "surrender-free"
          - "rider-free"
          - "interest-only"
          - "rmd"
    AssociatedFirmId:
      $ref: "${SHARED_SPECS_BASE}/AssociatedFirmId_v1.yaml#/components/parameters/AssociatedFirmId"
  headers:
    correlationId:
      $ref: "${SHARED_SPECS_BASE}/correlationId_v1.yaml#/components/headers/correlationId"
  responses:
    BadRequestError:
      $ref: "${SHARED_SPECS_BASE}/BadRequestError_v2.yaml#/components/responses/BadRequestError"
    UnauthorizedError:
      $ref: "${SHARED_SPECS_BASE}/UnauthorizedError_v2.yaml#/components/responses/UnauthorizedError"
    ForbiddenError:
      $ref: "${SHARED_SPECS_BASE}/ForbiddenError_v2.yaml#/components/responses/ForbiddenError"
    NotFoundError:
      $ref: "${SHARED_SPECS_BASE}/NotFoundError_v2.yaml#/components/responses/NotFoundError"
    MethodNotAllowedError:
      $ref: "${SHARED_SPECS_BASE}/MethodNotAllowedError_v2.yaml#/components/responses/MethodNotAllowedError"
    NotAcceptableError:
      $ref: "${SHARED_SPECS_BASE}/NotAcceptableError_v2.yaml#/components/responses/NotAcceptableError"
    ConflictError:
      $ref: "${SHARED_SPECS_BASE}/ConflictError_v2.yaml#/components/responses/ConflictError"
    PayloadTooLargeError:
      $ref: "${SHARED_SPECS_BASE}/PayloadTooLargeError_v2.yaml#/components/responses/PayloadTooLargeError"
    UnsupportedMediaTypeError:
      $ref: "${SHARED_SPECS_BASE}/UnsupportedMediaTypeError_v2.yaml#/components/responses/UnsupportedMediaTypeError"
    UnprocessableEntityError:
      $ref: "${SHARED_SPECS_BASE}/UnprocessableEntityError_v2.yaml#/components/responses/UnprocessableEntityError"
    TooManyRequestsError:
      $ref: "${SHARED_SPECS_BASE}/TooManyRequestsError_v2.yaml#/components/responses/TooManyRequestsError"
    InternalServerError:
      $ref: "${SHARED_SPECS_BASE}/InternalServerError_v2.yaml#/components/responses/InternalServerError"
    BadGatewayError:
      $ref: "${SHARED_SPECS_BASE}/BadGatewayError_v2.yaml#/components/responses/BadGatewayError"
    ServiceUnavailableError:
      $ref: "${SHARED_SPECS_BASE}/ServiceUnavailableError_v2.yaml#/components/responses/ServiceUnavailableError"
    GatewayTimeoutError:
      $ref: "${SHARED_SPECS_BASE}/GatewayTimeoutError_v2.yaml#/components/responses/GatewayTimeoutError"
  schemas:
    TransactionAmounts:
      type: "object"
      description: "Defines the withdrawal amount details using either a fixed amount, percentage, or system-determined calculation based on `amountType`.

        Special Behavior (Conditional Validation): - This schema uses JSON Schema conditional logic (`if/then/not`) to enforce

        \  field requirements and mutual exclusivity based on `amountType`.

        - Consumers MUST structure the payload according to the selected `amountType`.

        Rules by amountType: - AMOUNT:

        \  - `requestedAmount` is REQUIRED

        \  - `requestedPercentage` MUST NOT be provided

        - PERCENTAGE:

        \  - `requestedPercentage` is REQUIRED

        \  - `requestedAmount` MUST NOT be provided

        - MAX, FREEWITHDRAWALAMOUNT, WITHDRAWALUNTILBASIS,

        \  EARNINGSONLY, PENALTYFREE, RIDERFREE:

        \  - Neither `requestedAmount` nor `requestedPercentage` should be provided

        \  - Withdrawal amount will be calculated by the system per product rules\n"
      properties:
        requestedAmount:
          description: "Amount requested by the user. If amountType = AMOUNT, then requestedAmount is required, and requestedPercentage must NOT be present.\n"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        requestedPercentage:
          description: "Percentage requested by the user. If amountType = PERCENTAGE, then requestedPercentage is required, and requestedAmount must NOT be present.\n"
          type: "number"
          minimum: 0
          maximum: 100
        amountType:
          description: "Specifies how the withdrawal amount is provided by the user. For example as a dollar amount, a percentage, or the maximum allowed amount.\n"
          type: "string"
          enum:
            - "AMOUNT"
            - "PERCENTAGE"
            - "MAX"
            - "FREEWITHDRAWALAMOUNT"
            - "WITHDRAWALUNTILBASIS"
            - "EARNINGSONLY"
            - "PENALTYFREE"
            - "RIDERFREE"
        disbursementType:
          description: "Type of amount for withdrawal such as Gross or Net."
          type: "string"
          enum:
            - "GROSS"
            - "NET"
        disbursementPaymentForm:
          description: "Type of disbursement method such as DTCC, EFT, etc."
          type: "string"
          enum:
            - "DTCC"
            - "EFT"
            - "ACH"
            - "CHECK"
            - "WIRE"
      required:
        - "amountType"
        - "disbursementType"
      allOf:
        - if:
            properties:
              amountType:
                description: "Specifies how the withdrawal amount is provided by the user. For example as a dollar amount, a percentage, or the maximum allowed amount."
                const: "AMOUNT"
            required:
              - "amountType"
          then:
            required:
              - "requestedAmount"
            not:
              required:
                - "requestedPercentage"
        - if:
            properties:
              amountType:
                description: "Specifies how the withdrawal amount is provided by the user. For example as a dollar amount, a percentage, or the maximum allowed amount."
                const: "PERCENTAGE"
            required:
              - "amountType"
          then:
            required:
              - "requestedPercentage"
            not:
              required:
                - "requestedAmount"
        - if:
            properties:
              amountType:
                description: "Specifies how the withdrawal amount is provided by the user. For example as a dollar amount, a percentage, or the maximum allowed amount."
                enum:
                  - "MAX"
                  - "FREEWITHDRAWALAMOUNT"
                  - "WITHDRAWALUNTILBASIS"
                  - "EARNINGSONLY"
          then:
            required:
              - "amountType"
            not:
              anyOf:
                - required:
                    - "requestedAmount"
                - required:
                    - "requestedPercentage"
    TransactionAmountsFull:
      type: "object"
      description: "Details of financial amounts associated with the transaction"
      properties:
        disbursementType:
          description: "Type of amount for withdrawal such as Gross or Net."
          type: "string"
          enum:
            - "GROSS"
            - "NET"
        disbursementPaymentForm:
          description: "Type of disbursement method such as DTCC, EFT, etc."
          type: "string"
          enum:
            - "DTCC"
            - "EFT"
            - "ACH"
            - "CHECK"
            - "WIRE"
      required:
        - "disbursementType"
    PayeeOrBeneficiary:
      type: "object"
      description: "The payeeOrBeneficiary object represents how the withdrawal proceeds are distributed and to whom. It includes payment form, allocation rules for each payee.\n"
      properties:
        paymentForm:
          description: "Mode of payment."
          type: "string"
          enum:
            - "DTCC"
            - "ACH"
            - "CHECK"
            - "WIRE"
            - "EXCHANGE"
        allocationPercentage:
          description: "Allocation percentage."
          type: "number"
          minimum: 0
          maximum: 100
        party:
          description: "Common party identity fields."
          anyOf:
            - $ref: "#/components/schemas/IndividualIdentity"
            - $ref: "#/components/schemas/EntityIdentity"
        bank:
          description: "Financial institution details."
          $ref: "#/components/schemas/Bank"
        address:
          description: "Physical or mailing address details."
          $ref: "#/components/schemas/Address"
    TaxWithholdingInstruction:
      type: "object"
      description: "Defines tax withholding instructions for a party in the withdrawal request. Valid Options: - Provide `dollar`:

        \  - Represents a fixed withholding amount

        \  - `percentage` must not be provided


        - Provide `percentage`:

        \  - Represents withholding as a percentage

        \  - `dollar` must not be provided


        - Provide neither:

        \  - Indicates no explicit withholding amount is supplied

        \  - Typically aligns with taxRateToUse values such as

        \    NOWITHHOLDINGELECTED, USEDEFAULTTABLE, NOWITHHOLDINGALLOWED


        Invalid Scenarios: - Providing both `dollar` and `percentage` - Providing partial or conflicting withholding inputs

        Notes: - Exactly one of the above conditions must be satisfied - Validation will fail if none or multiple conditions match\n"
      properties:
        party:
          description: "Impacted party details for withholding."
          anyOf:
            - $ref: "#/components/schemas/IndividualIdentity"
            - $ref: "#/components/schemas/EntityIdentity"
        taxWithholdingType:
          description: "Type of tax withholding."
          type: "string"
          enum:
            - "FEDERAL"
            - "STATE"
            - "NRA"
            - "BACKUP"
        taxRateToUse:
          description: "Selected tax rate source."
          type: "string"
          enum:
            - "NOWITHHOLDINGELECTED"
            - "USEVALUESENTERED"
            - "NOWITHHOLDINGALLOWED"
            - "USEDEFAULTTABLE"
        filingStatus:
          description: "Tax filing status."
          type: "string"
          enum:
            - "SINGLE"
            - "DOMESTICPARTNERSHIP"
            - "DEFAULT"
            - "MARRIED"
            - "HEADOFHOUSEHOLD"
            - "WIDOWED"
            - "DIVORCED"
        dollar:
          type: "number"
          description: "Fixed dollar amount to withhold. Mutually exclusive with percentage; provide one, not both."
          minimum: 0
          maximum: 9999999999.99
        percentage:
          type: "number"
          description: "Percentage amount to withhold"
          minimum: 0
          maximum: 100
        taxJurisdiction:
          description: "Jurisdiction for tax purposes. If taxWithholdingType=STATE this field should be mandatory."
          type: "string"
          maxLength: 50
      required:
        - "taxWithholdingType"
        - "taxRateToUse"
      oneOf:
        - description: "Use a fixed dollar amount for withholding."
          required:
            - "dollar"
        - description: "Use a percentage for withholding."
          required:
            - "percentage"
        - description: "No withholding amount required (e.g. taxRateToUse of NOWITHHOLDINGELECTED ,USEDEFAULTTABLE, NOWITHHOLDINGALLOWED). Neither dollar nor percentage is supplied.\n"
          not:
            anyOf:
              - required:
                  - "dollar"
              - required:
                  - "percentage"
      allOf:
        - if:
            properties:
              taxWithholdingType:
                const: "STATE"
          then:
            required:
              - "taxJurisdiction"
    Party:
