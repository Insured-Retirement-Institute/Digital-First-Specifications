              - "amountType"
            not:
              anyOf:
                - required:
                    - "requestedAmount"
                - required:
                    - "requestedPercentage"
    Charge:
      type: "object"
      required:
        - "chargeType"
        - "chargeAmount"
        - "chargeCategory"
      properties:
        chargeType:
          type: "string"
          description: "Carrier-defined or product-defined charge label (e.g., SURRENDERCHARGE, ADMINISTRATIVE, LOANPAYOFF)."
          maxLength: 50
        chargeAmount:
          description: "The amount of the charge applied for this transaction."
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        chargeCategory:
          description: "The category of the charge"
          type: "string"
          enum:
            - "FEE"
            - "TAX"
            - "LOAN_DEDUCTION"
            - "ADJUSTMENT"
        isChargeWaived:
          description: "Indicates if charge is waived."
          type: "boolean"
        chargeWaiverReason:
          description: "Reason for charge waiver."
          type: "string"
          maxLength: 100
        isMvaApplied:
          description: "Indicates if MVA is applied."
          type: "boolean"
        loanDeduction:
          $ref: "#/components/schemas/LoanDeduction"
      allOf:
        - if:
            properties:
              chargeCategory:
                description: "The category of the charge"
                const: "LOAN_DEDUCTION"
            required:
              - "chargeCategory"
          then:
            required:
              - "loanDeduction"
          else:
            not:
              required:
                - "loanDeduction"
    LoanDeduction:
      type: "object"
      description: "Loan-related deductions that reduce the net disbursement."
      properties:
        loanType:
          description: "The type of the loan"
          type: "string"
          enum:
            - "POLICY_LOAN"
            - "AUTOMATIC_PREMIUM_LOAN"
            - "LOAN_REPAYMENT"
            - "LOAN_INTEREST"
            - "PREFERRED"
            - "OTHER"
        loanInterestType:
          description: "The type of interest on the loan"
          type: "string"
          enum:
            - "FIXED"
            - "VARIABLE"
            - "INDEXED"
            - "OTHER"
        loanPrincipalDeductedAmount:
          description: "The amount of the loan principal that is deducted."
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        loanInterestDeductedAmount:
          description: "The amount of the loan interest that is deducted"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        loanPayoffIndicator:
          description: "Indicator for the loan payoff"
          type: "boolean"
    TaxWithheldAmount:
      type: "object"
      required:
        - "taxWithholdingType"
        - "withholdAmount"
        - "taxId"
      properties:
        taxId:
          description: "Tax Identification Number for the individual or entity"
          type: "string"
          maxLength: 9
        taxWithholdingType:
          description: "Type of tax withholding."
          type: "string"
          enum:
            - "FEDERAL"
            - "STATE"
            - "NRA"
            - "BACKUP"
        withholdAmount:
          description: "Amount of tax withholding"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        withheldTaxableAmount:
          description: "The taxable portion of the payment that this withholding was calculated against."
          type: "number"
          minimum: 0
          maximum: 9999999999.99
    PayeeOrBeneficiary:
      type: "object"
      description: "The payeeOrBeneficiary object represents how the withdrawal proceeds are distributed and to whom. It includes payment form, allocation rules for each payee.\n"
      required:
        - "paymentForm"
        - "allocationPercentage"
        - "disbursementAmount"
        - "taxId"
      properties:
        taxId:
          description: "Tax Identification Number for the individual or entity"
          type: "string"
          maxLength: 9
        paymentForm:
          description: "Mode of payment"
          type: "string"
          enum:
            - "DTCC"
            - "CREDITCARD"
            - "ACH"
            - "CHECK"
            - "WIRE"
            - "EXCHANGE"
        allocationPercentage:
          description: "Allocation percentage."
          type: "number"
          minimum: 0
          maximum: 100
        disbursementAmount:
          description: "The amount of the disbursement."
          type: "number"
          minimum: 0
          maximum: 9999999999.99
    TaxQualification:
      type: "object"
      description: "TEFRA/TEMRA and related tax qualification fields returned with the quote."
      properties:
        isTefraApplicable:
          description: "Indicates if tefra is applied."
          type: "boolean"
        isTemraApplicable:
          description: "Indicates if temra is applied."
          type: "boolean"
        tefraValue:
          description: "Tefra value"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        temraValue:
          description: "Temra value"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        isirc72qPenaltyApplied:
          description: "Indicates if the IRC72Q penalty is applied"
          type: "boolean"
        taxablePortionRule:
          description: "Taxable portion rule"
          type: "string"
          enum:
            - "LIFO"
            - "FIFO"
    Party:
      description: "The parties object represents the policy parties relevant to the withdrawal (owners, annuitants, beneficiaries, etc.), along with their identity, relationship, and payout instructions.\n"
      type: "object"
      anyOf:
        - $ref: "#/components/schemas/IndividualParty"
        - $ref: "#/components/schemas/EntityParty"
      properties:
        paymentForm:
          description: "Mode of payment"
          type: "string"
          enum:
            - "DTCC"
            - "CREDITCARD"
            - "ACH"
            - "CHECK"
            - "WIRE"
            - "EXCHANGE"
        allocationPercentage:
          description: "Allocation percentage."
          type: "number"
          minimum: 0
          maximum: 100
      required:
        - "paymentForm"
        - "allocationPercentage"
    IndividualParty:
      description: "Schema for individual party data"
      type: "object"
      allOf:
        - $ref: "#/components/schemas/IndividualIdentity"
        - $ref: "#/components/schemas/PartyRelationship"
    EntityParty:
      description: "Schema for entity party data"
      type: "object"
      allOf:
        - $ref: "#/components/schemas/EntityIdentity"
        - $ref: "#/components/schemas/PartyRelationship"
    IndividualIdentity:
      $ref: "${SHARED_SPECS_BASE}/IndividualIdentity_v1.yaml#/components/schemas/IndividualIdentity"
    PartyRelationship:
      $ref: "${SHARED_SPECS_BASE}/PartyRelationship_v1.yaml#/components/schemas/PartyRelationship"
    EntityIdentity:
      $ref: "${SHARED_SPECS_BASE}/EntityIdentity_v1.yaml#/components/schemas/EntityIdentity"
    RmdInfo:
      type: "object"
      description: "RMD details specific to partial one-time withdrawals"
      properties:
        rmdTaxYear:
          description: "The tax year this RMD withdrawal is for (for example, 2025). Used to decide which year's RMD requirement the withdrawal is satisfying."
          type: "integer"
          minimum: 1900
          maximum: 2100
        rmdAgeAtDistribution:
          description: "The age of the RMD owner on the distribution date, in whole years. If not sent, the carrier or platform may calculate it from date of birth."
          type: "integer"
          minimum: 0
          maximum: 150
        rmdSpouseDoB:
          description: "The date of birth of the spouse of owner/annuitant."
          type: "string"
          format: "date"
        rmdRequestedAmount:
          description: "The portion of this withdrawal that should count toward RMD for rmdTaxYear. In many cases this will match transactionAmounts.requestedAmount when the entire withdrawal is intended to satisfy RMD."
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        rmdCalculationMethod:
          description: "The method or IRS table used to calculate the RMD. Used mainly for audit/explanation."
          type: "string"
          enum:
            - "UNIFORM_LIFETIME_TABLE"
            - "JOINT_LIFE"
            - "SINGLE_LIFE"
            - "OTHER"
        rmdPriorYearEndValue:
          description: "The contract value as of 12/31 of the prior year used as the base for RMD calculation. Including this allows downstream systems to re-check or explain the RMD math."
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        calculatedAnnualRmdAmount:
          description: "The annual amount of the RMD"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        remainingRmdAmountAfterThisQuote:
          description: "The amount of RMD remaining after this quote"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        rmdWithdrawalAmountThisYear:
          description: "The RMD withdrawal amount for this current year"
          type: "number"
          minimum: 0
          maximum: 9999999999.99
        totalRMDAmountRemaining:
          description: "Remaining dollar amount that must still be withdrawn this calendar year to fully satisfy the Required Minimum Distribution."
          type: "number"
          minimum: 0
          maximum: 9999999999.99
      required:
        - "rmdTaxYear"
        - "rmdRequestedAmount"
        - "rmdCalculationMethod"
    ErrorItem:
      type: "object"
      properties:
        errorCode:
          description: "The unique code identifying the type of error"
          type: "string"
        error:
          description: "Error returned when status=FAILURE"
          type: "string"
        errorDescription:
          description: "Description of the error"
          type: "string"
    Error:
      $ref: "${SHARED_SPECS_BASE}/Error_v2.yaml#/components/schemas/Error"
