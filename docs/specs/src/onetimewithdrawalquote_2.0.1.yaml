components:
  parameters:
    PolicyNumber:
      $ref: "${SHARED_SPECS_BASE}/PolicyNumber_v1.yaml#/components/parameters/PolicyNumber"
    TransactionSubType:
      name: "transactionSubType"
      in: "query"
      required: true
      description: "Required for one-time partial withdrawal quotes. Not used for full surrenders. For one-time RMD quotes, select transactionSubType as rmd.\n"
      schema:
        type: "string"
        enum:
          - "specified-withdrawal"
          - "surrender-free"
          - "rider-free"
          - "interest-only"
          - "rmd"
    CorrelationIdHeader:
      $ref: "${SHARED_SPECS_BASE}/CorrelationIdHeader_v1.yaml#/components/parameters/CorrelationIdHeader"
    AssociatedFirmId:
      $ref: "${SHARED_SPECS_BASE}/AssociatedFirmId_v1.yaml#/components/parameters/AssociatedFirmId"
  headers:
    correlationId:
      $ref: "${SHARED_SPECS_BASE}/correlationId_v1.yaml#/components/headers/correlationId"
  responses:
    BadRequestError:
      $ref: "${SHARED_SPECS_BASE}/BadRequestError_v2.yaml#/components/responses/BadRequestError"
    UnauthorizedError:
      $ref: "${SHARED_SPECS_BASE}/UnauthorizedError_v2.yaml#/components/responses/UnauthorizedError"
    ForbiddenError:
      $ref: "${SHARED_SPECS_BASE}/ForbiddenError_v2.yaml#/components/responses/ForbiddenError"
    NotFoundError:
      $ref: "${SHARED_SPECS_BASE}/NotFoundError_v2.yaml#/components/responses/NotFoundError"
    MethodNotAllowedError:
      $ref: "${SHARED_SPECS_BASE}/MethodNotAllowedError_v2.yaml#/components/responses/MethodNotAllowedError"
    NotAcceptableError:
      $ref: "${SHARED_SPECS_BASE}/NotAcceptableError_v2.yaml#/components/responses/NotAcceptableError"
    ConflictError:
      $ref: "${SHARED_SPECS_BASE}/ConflictError_v2.yaml#/components/responses/ConflictError"
    PayloadTooLargeError:
      $ref: "${SHARED_SPECS_BASE}/PayloadTooLargeError_v2.yaml#/components/responses/PayloadTooLargeError"
    UnsupportedMediaTypeError:
      $ref: "${SHARED_SPECS_BASE}/UnsupportedMediaTypeError_v2.yaml#/components/responses/UnsupportedMediaTypeError"
    UnprocessableEntityError:
      $ref: "${SHARED_SPECS_BASE}/UnprocessableEntityError_v2.yaml#/components/responses/UnprocessableEntityError"
    TooManyRequestsError:
      $ref: "${SHARED_SPECS_BASE}/TooManyRequestsError_v2.yaml#/components/responses/TooManyRequestsError"
    InternalServerError:
      $ref: "${SHARED_SPECS_BASE}/InternalServerError_v2.yaml#/components/responses/InternalServerError"
    BadGatewayError:
      $ref: "${SHARED_SPECS_BASE}/BadGatewayError_v2.yaml#/components/responses/BadGatewayError"
    ServiceUnavailableError:
      $ref: "${SHARED_SPECS_BASE}/ServiceUnavailableError_v2.yaml#/components/responses/ServiceUnavailableError"
    GatewayTimeoutError:
      $ref: "${SHARED_SPECS_BASE}/GatewayTimeoutError_v2.yaml#/components/responses/GatewayTimeoutError"
  schemas:
    OneTimePartialWithdrawalQuoteRequest:
      type: "object"
      description: "Request to perform a one-time partial withdrawal.\n"
      properties:
        effectiveDate:
          description: "when the transaction was originally scheduled or expected to happen, can be a non-business day"
          type: "string"
          format: "date"
        nsccParticipantId:
          description: "Unique identifier for the submitting firm or participant within the NSCC network."
          type: "string"
          maxLength: 100
        cusip:
          type: "string"
          minLength: 9
          maxLength: 9
          pattern: "^[0-9]{3}[A-Z0-9]{5}[0-9]$"
          description: "CUSIP"
        producer:
          description: "Licensed producer information"
          $ref: "#/components/schemas/Producer"
        transactionAmounts:
          description: "Details of financial amounts associated with the transaction."
          $ref: "#/components/schemas/TransactionAmountsRequest"
        allocationOption:
          type: "string"
          enum:
            - "PRORATA"
            - "DOLLAR"
            - "SPECIFYPERCENTAGE"
            - "SPECIFIEDFUNDS"
            - "SPECIFIEDSEGMENTS"
            - "DEFAULT"
            - "PECKINGORDER"
            - "EARNINGSONLY"
          description: "Defines the format of how the funds are removed"
        fundDistributions:
          description: "Detailed allocation of funds"
          type: "array"
          items:
            $ref: "#/components/schemas/FundDistribution"
        rmdInfo:
          $ref: "#/components/schemas/RmdInfo"
        payeeOrBeneficiary:
          description: "The payeeOrBeneficiary object represents how the withdrawal proceeds are distributed and to whom. It includes payment form, allocation rules for each payee."
          type: "array"
          items:
            $ref: "#/components/schemas/PayeeOrBeneficiary"
        parties:
          description: "The parties object represents the policy parties relevant to the withdrawal (owners, annuitants, beneficiaries, etc.), along with their identity, relationship, and payout instructions."
          type: "array"
          items:
            $ref: "#/components/schemas/Party"
        taxWithholdingInstructions:
          description: "List of tax withholding instruction entries."
          type: "array"
          items:
            $ref: "#/components/schemas/TaxWithholdingInstruction"
        charges:
          description: "List of charges (fees and deductions) applied to the transaction."
          type: "array"
          items:
            $ref: "#/components/schemas/Charges"
        isOverride:
          description: "Override rules if true"
          type: "boolean"
      required:
        - "effectiveDate"
        - "allocationOption"
        - "nsccParticipantId"
      allOf:
        - if:
            properties:
              allocationOption:
                const: "SPECIFIEDFUNDS"
              transactionAmounts:
                description: "Details of financial amounts associated with the transaction."
                type: "object"
                properties:
                  amountType:
                    description: "Indicates the method used to calculate the transfer value, such as a specified dollar amount, a percentage of contract value, or a full rebalance. This value drives how amounts are specified throughout the transaction."
                    const: "PERCENTAGE"
                required:
                  - "amountType"
            required:
              - "allocationOption"
              - "transactionAmounts"
          then:
            required:
              - "fundDistributions"
            properties:
              fundDistributions:
                description: "Detailed allocation of funds"
                type: "array"
                items:
                  allOf:
                    - $ref: "#/components/schemas/FundDistribution"
                    - type: "object"
                      required:
                        - "requestedPercentage"
                    - not:
                        required:
                          - "requestedAmount"
        - if:
            properties:
              allocationOption:
                const: "SPECIFIEDFUNDS"
              transactionAmounts:
                description: "Details of financial amounts associated with the transaction."
                type: "object"
                properties:
                  amountType:
                    description: "Indicates the method used to calculate the transfer value, such as a specified dollar amount, a percentage of contract value, or a full rebalance. This value drives how amounts are specified throughout the transaction."
