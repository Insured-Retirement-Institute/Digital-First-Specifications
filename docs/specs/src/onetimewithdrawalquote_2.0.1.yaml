# Modified by Cursor: source spec — bundled to docs/specs/onetimewithdrawalquote_2.0.1.yaml
# TODO: align to shared Error_v1 — see ERROR-SCHEMA-DEBT.md
openapi: "3.1.0"
info:
  title: "Withdrawal Quote API"
  version: "2.0.1"
  description: "A single, standardized **POST** quote endpoint for withdrawal transactions.\n"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
paths:
  /v1/policies/{policyNumber}/withdrawals/full-surrenders/quote:
    post:
      operationId: "calculateFullSurrenderQuote"
      tags:
        - "Withdrawal Quote"
      description: "Calculate a withdrawal quote for a **full surrender** transaction. This is a synchronous compute action\n"
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/PolicyNumber"
        - $ref: "#/components/parameters/AssociatedFirmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FullSurrenderQuoteRequest"
            examples:
              FullSurrenderQuoteRequest_Example:
                summary: "Full Surrender Quote compute request"
                value:
                  effectiveDate: "2026-01-16"
                  nsccParticipantId: "NSCC999"
                  cusip: "0275IFOW4"
                  producer:
                    producerNumber: "PROD999"
                    npn: "9876543210"
                    crdNumber: "1234567890"
                  transactionAmounts:
                    disbursementType: "NET"
                    disbursementPaymentForm: "EFT"
                  payeeOrBeneficiary:
                    - paymentForm: "EFT"
                      allocationPercentage: 100
                      party:
                        firstName: "Taylor"
                        middleName: "A"
                        lastName: "Johnson"
                        type: "individual"
                        taxId: "123456789"
                      bank:
                        bankId: "Bank_FS"
                        nameOnAccount: "Taylor Johnson"
                        accountStatus: "ACTIVEBANKACCOUNT"
                        accountType: "CHECKING"
                        accountNumber: "9876543210"
                        routingNumber: "987654321"
                        branchName: "Central Branch"
                  parties:
                    - paymentForm: "EFT"
                      allocationPercentage: 100
                      bank:
                        bankId: "Bank_FS"
                        nameOnAccount: "Taylor Johnson"
                        accountStatus: "ACTIVEBANKACCOUNT"
                        accountType: "CHECKING"
                        accountNumber: "9876543210"
                        routingNumber: "987654321"
                        branchName: "Central Branch"
                      address:
                        addressId: "Addr_FS"
                        addressType: "RESIDENCE"
                        addressLine1: "200 Main St"
                        city: "New York"
                        state: "NY"
                        zipCode: "10001"
                        country: "US"
      responses:
        "200":
          description: "Withdrawal quote calculated successfully."
          headers:
            correlationId:
              description: "Optional client-supplied identifier to trace the request."
              $ref: "#/components/headers/correlationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullSurrenderQuoteResponse"
              examples:
                FullSurrenderResponse:
                  summary: "Full Surrender Quote Response"
                  value:
                    status: "SUCCESS"
                    policyNumber: "POL123456789"
                    effectiveDate: "2026-01-16"
                    cusip: "0275IFOW4"
                    freeWithdrawalAmount: 1000
                    remainingFreeWithdrawalAmount: 500
                    tenPercentOfPurchasePayments: 10000
                    freeAmountGain: 120
                    freeAmountPremium: 300
                    transactionAmounts:
                      appliedAmount: 5000
                      taxableAmount: 1200
                      totalChargeAmount: 50
                      totalTaxWithheldAmount: 100
                      netPaymentAmount: 4850
                      disbursementType: "GROSS"
                      disbursementPaymentForm: "DTCC"
                      grossPaymentAmount: 5000
                      cashSurrenderValue: 25000
                      accumulatedCashValue: 18000
                      grossCashValueAmount: 25000
                    charges:
                      - chargeType: "SURRENDERCHARGE"
                        chargeAmount: 50
                        chargeCategory: "FEE"
                        isChargeWaived: false
                        chargeWaiverReason: "NONE"
                        isMvaApplied: false
                    taxWithheldAmounts:
                      - taxId: "123456789"
                        taxWithholdingType: "FEDERAL"
                        withholdAmount: 100
                        withheldTaxableAmount: 1200
                    payeeOrBeneficiary:
                      - taxId: "123456789"
                        paymentForm: "DTCC"
                        allocationPercentage: 100
                        disbursementAmount: 4850
                    taxQualification:
                      isTefraApplicable: true
                      isTemraApplicable: true
                      tefraValue: 100
                      temraValue: 100
                      isirc72qPenaltyApplied: false
                      taxablePortionRule: "LIFO"
                    parties:
                      - taxId: "123456789"
                        firstName: "Taylor"
                        middleName: "A"
                        lastName: "Johnson"
                        type: "individual"
                        relationships:
                          - "owner"
                        paymentForm: "DTCC"
                        allocationPercentage: 100
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "406":
          $ref: "#/components/responses/NotAcceptableError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeError"
        "422":
          $ref: "#/components/responses/UnprocessableEntityError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGatewayError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "504":
          $ref: "#/components/responses/GatewayTimeoutError"
  /v1/policies/{policyNumber}/withdrawals/one-time-partials/quote:
    post:
      operationId: "calculateOneTimePartialWithdrawalQuote"
      tags:
        - "Withdrawal Quote"
      description: "Calculate a quote for a **one-time partial withdrawal** (including RMD when transactionSubType is `rmd`).\n"
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - $ref: "#/components/parameters/PolicyNumber"
        - $ref: "#/components/parameters/TransactionSubType"
        - $ref: "#/components/parameters/AssociatedFirmId"
      x-business-rule:
        rmd:
          when:
            transactionSubType: "rmd"
          require:
            - "$.rmdInfo"
        nonRmd:
          when:
            transactionSubType:
              not:
                in:
                  - "rmd"
          constraints:
            - name: "forbid-rmdInfo-when-not-rmd"
              description: "When transactionSubType is not RMD, rmdInfo must be omitted to avoid ambiguous payloads."
              assert: "$.rmdInfo == null"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimePartialWithdrawalQuoteRequest"
            examples:
              PartialWithdrawalQuoteRequest_RMD:
                summary: "Partial one-time withdrawal (RMD) quote compute request"
