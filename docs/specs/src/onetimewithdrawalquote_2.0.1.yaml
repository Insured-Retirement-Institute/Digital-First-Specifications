            - "MARRIED"
            - "HEADOFHOUSEHOLD"
            - "WIDOWED"
            - "DIVORCED"
        dollar:
          type: "number"
          description: "Fixed dollar amount to withhold. Mutually exclusive with percentage; provide one, not both."
          minimum: 0
          maximum: 9999999999.99
        percentage:
          type: "number"
          description: "Percentage amount to withhold"
          minimum: 0
          maximum: 100
