        - description: "Use a percentage for withholding."
          required:
            - "percentage"
        - description: "No withholding amount required (e.g. taxRateToUse of NOWITHHOLDINGELECTED ,USEDEFAULTTABLE, NOWITHHOLDINGALLOWED). Neither dollar nor percentage is supplied.\n"
