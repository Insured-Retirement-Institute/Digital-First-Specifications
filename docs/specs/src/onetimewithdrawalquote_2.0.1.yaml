                  parties:
                    - taxId: "123456789"
                      firstName: "Jordan"
                      middleName: "C"
                      lastName: "Kim"
                      type: "individual"
                      relationships:
                        - "owner"
                      paymentForm: "CHECK"
                      allocationPercentage: 100
                      bank:
                        bankId: "Bank_NRMD"
                        nameOnAccount: "Jordan Kim"
                        accountStatus: "ACTIVEBANKACCOUNT"
                        accountType: "CHECKING"
