      responses:
        "200":
          description: "Withdrawal quote calculated successfully."
          headers:
            correlationId:
              description: "Optional client-supplied identifier to trace the request."
              $ref: "#/components/headers/correlationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartialsWithdrawalQuoteResponse"
              examples:
                partialRmdResponse:
                  summary: "Partial One-Time Withdrawal - RMD Quote Response"
                  value:
                    status: "SUCCESS"
                    policyNumber: "POL123456789"
                    effectiveDate: "2026-01-16"
                    cusip: "0275IFOW4"
                    freeWithdrawalAmount: 1000
                    remainingFreeWithdrawalAmount: 500
                    tenPercentOfPurchasePayments: 10000
