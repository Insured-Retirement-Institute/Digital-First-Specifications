# TODO: align to shared Error_v1 — see ERROR-SCHEMA-DEBT.md
openapi: "3.1.0"
info:
  title: "Annuity Beneficiary Data Exchange API"
  version: "1.0.0"
  description: "Direction-neutral annuity event exchange specification intended for use by both

    Distributors and Carriers.


    Any participant MAY act as sender by POSTing a BeneficiaryEventEnvelope to the

    receiving party's /v1/accounts/beneficiary/events endpoint.


    Supported event types are:

    \  - PROPOSED

    \  - BOOKED

    \  - REJECTED


    BOOKED and REJECTED events MAY be sent either:

    \  * in response to a previously submitted PROPOSED event, or

    \  * as independently originated events representing a beneficiary change initiated

    \    outside this API workflow (for example through a customer call center

    \    interaction, paper form submission, or carrier portal transaction).


    When a BOOKED or REJECTED event is sent as the outcome of a previously submitted

    PROPOSED event, the receiving party SHALL use the same beneficiaryTransactionId

    supplied in the originating PROPOSED event.


    Security mechanisms (for example OAuth, mutual TLS, IP allowlisting, and related

    controls) and trading-partner endpoint URLs are established through bilateral

    onboarding agreements and are outside the scope of this specification.\n"
  contact:
    name: "IRI Digital First Specifications"
servers:
  - url: "https://{host}"
    description: "Non-normative placeholder. The receiving participant's host is established through bilateral onboarding and is outside the scope of this specification.\n"
    variables:
      host:
        default: "partner.example.com"
paths:
  /v1/accounts/beneficiary/events:
    post:
      summary: "Inbound Beneficiary Events"
      description: "Accepts beneficiary lifecycle events.

        This endpoint supports direction-neutral exchange of beneficiary events between distributors and carriers.

        Event types include:


        \  * PROPOSED

        \  * BOOKED

        \  * REJECTED


        BOOKED and REJECTED events may either represent:


        \  * the outcome of a previously submitted PROPOSED

        \    event, correlated through beneficiaryTransactionId, or


        \  * an independently generated notification of a

        \    beneficiary change initiated outside this API workflow.


        A 202 ACCEPTED response indicates successful receipt and validation of the submitted event and does not imply business acceptance of the beneficiary change.

        Delivery semantics:


        \  * Delivery is at-least-once. Receivers SHALL de-duplicate on the

        \    composite key (senderParticipantId, eventId) and SHALL retain that

        \    key for a minimum of 30 calendar days.


        \  * A redelivery of an event whose (senderParticipantId, eventId) has

        \    already been accepted SHALL return 202 with the original EventAck.

        \    A reuse of the same eventId with a materially different payload

        \    SHALL return 409 with code beneficiary.transport.duplicate-event-id.


        \  * Senders SHALL retry on 429 and 5xx responses using exponential

        \    backoff (initial delay 1 second, factor 2, maximum 6 attempts) and

        \    SHALL honor the Retry-After header when present. Senders SHALL NOT

        \    retry 400, 401, 403, 415 or 422 responses without correction.


        \  * Ordering is not guaranteed. A receiver that receives a BOOKED or

        \    REJECTED event whose beneficiaryTransactionId is not known to it

        \    SHALL process the event as an independently originated event.


        \  * replayOfEventId identifies a prior transmission that is being resent.

        \    A replay SHALL carry a new eventId and SHALL reference the original

        \    eventId in replayOfEventId. Receivers SHALL treat a replay as a

        \    duplicate of the referenced event when that event was already applied.


        \  * A BOOKED or REJECTED outcome for a PROPOSED event is expected within

        \    two business days. Recovery when an outcome is not received is handled

        \    through the bilateral operational agreement.\n"
      operationId: "postBeneficiaryEvent"
      parameters:
        - $ref: "#/components/parameters/XApiVersion"
        - $ref: "#/components/parameters/XCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiaryEventEnvelope"
            examples:
              proposed:
                summary: "Distributor proposes a replacement of the PRIMARY designations"
                value:
                  eventId: "3f2b9c14-8b0e-4f6a-9c31-6a1d2e5f7b80"
                  eventType: "insurance.annuity.beneficiary.proposed.v1"
                  eventTimestamp: "2026-09-01T14:32:10Z"
                  senderParticipantId: "01234567"
                  receiverParticipantId: "07654321"
                  payload:
                    beneficiaryEventId: "BEN-EVT-000123"
                    beneficiaryTransactionId: "TXN-2026-09-01-000123"
                    beneficiaryEventType: "PROPOSED"
                    sourceSystem: "DISTRIBUTOR"
                    processedTimestamp: "2026-09-01T14:31:58Z"
                    requestorContext:
                      requestorRole: "OWNER"
                      submissionChannel: "ADVISOR_PORTAL"
                      requestedByPartyId: "ADV-88214"
                    beneficiaryTypesInScope:
                      - "PRIMARY"
                    contract:
                      policyNumber: "AN0012345678"
                      associatedFirmId: "FIRM-4471"
                    beneficiaries:
                      - beneficiaryType: "PRIMARY"
                        relationshipType: "SPOUSE"
                        allocationPercentage: 60
                        dob: "1975-04-12"
                        name:
                          firstName: "María"
                          lastName: "Nuñez"
                        address:
                          addressType: "RESIDENCE"
                          addressLine1: "100 Main Street"
                          city: "Boston"
                          state: "MA"
                          zipCode: "02110"
                          country: "US"
                      - beneficiaryType: "PRIMARY"
                        relationshipType: "CHILD"
                        allocationPercentage: 40
                        designationSuccessionType: "PER_STIRPES"
                        name:
                          firstName: "Liam"
                          lastName: "Nuñez"
              bookedOutcome:
                summary: "Carrier books the previously proposed change"
                value:
                  eventId: "8c41d5a2-1f77-4c0b-b3e8-9d20cf14a662"
                  eventType: "insurance.annuity.beneficiary.booked.v1"
                  eventTimestamp: "2026-09-02T09:05:44Z"
                  senderParticipantId: "07654321"
                  receiverParticipantId: "01234567"
                  payload:
                    beneficiaryEventId: "CAR-EVT-778101"
                    beneficiaryTransactionId: "TXN-2026-09-01-000123"
                    beneficiaryEventType: "BOOKED"
                    sourceSystem: "CARRIER"
                    processedTimestamp: "2026-09-02T09:04:02Z"
                    beneficiaryTypesInScope:
                      - "PRIMARY"
                    contract:
                      policyNumber: "AN0012345678"
                    beneficiaries:
                      - beneficiaryId: "CARBEN-0001"
                        beneficiaryType: "PRIMARY"
                        relationshipType: "SPOUSE"
                        allocationPercentage: 60
                        name:
                          firstName: "María"
                          lastName: "Nuñez"
                      - beneficiaryId: "CARBEN-0002"
                        beneficiaryType: "PRIMARY"
                        relationshipType: "CHILD"
                        allocationPercentage: 40
                        designationSuccessionType: "PER_STIRPES"
                        name:
                          firstName: "Liam"
                          lastName: "Nuñez"
              rejectedOutcome:
                summary: "Carrier rejects the proposal; beneficiaries echoes the submission"
                value:
                  eventId: "b2d0f9e7-5a63-49d1-8f2c-0e7a4b118d35"
                  eventType: "insurance.annuity.beneficiary.rejected.v1"
                  eventTimestamp: "2026-09-02T09:06:12Z"
                  senderParticipantId: "07654321"
                  receiverParticipantId: "01234567"
                  payload:
                    beneficiaryEventId: "CAR-EVT-778102"
                    beneficiaryTransactionId: "TXN-2026-09-01-000123"
                    beneficiaryEventType: "REJECTED"
                    sourceSystem: "CARRIER"
                    processedTimestamp: "2026-09-02T09:05:59Z"
                    beneficiaryTypesInScope:
                      - "PRIMARY"
                    contract:
                      policyNumber: "AN0012345678"
                    rejection:
                      rejectionCode: "beneficiary.business.allocation-invalid"
                      rejectionMessage: "PRIMARY allocations must total exactly 100.00 percent."
                      timestamp: "2026-09-02T09:05:59Z"
                      fieldErrors:
                        - path: "$.beneficiaries[1].allocationPercentage"
                          code: "beneficiary.business.allocation-invalid"
                          message: "PRIMARY allocations total 90.00 percent."
                    beneficiaries:
                      - beneficiaryType: "PRIMARY"
                        relationshipType: "SPOUSE"
                        allocationPercentage: 60
                        name:
                          firstName: "María"
                          lastName: "Nuñez"
                      - beneficiaryType: "PRIMARY"
                        relationshipType: "CHILD"
                        allocationPercentage: 30
                        name:
                          firstName: "Liam"
                          lastName: "Nuñez"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    XApiVersion:
      name: "X-Api-Version"
      in: "header"
      required: false
      description: "Full semantic version of this API specification within the /v1 contract. Senders SHOULD include this header to convey the implemented specification revision within the stable /v1 contract. This header identifies the API specification revision and SHALL NOT change the eventType taxonomy.\n"
      schema:
        type: "string"
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
        maxLength: 32
    XCorrelationId:
      name: "X-Correlation-Id"
      in: "header"
      required: false
      description: "Sender-assigned trace identifier for end-to-end request tracing. When omitted the receiver SHALL generate a unique value and return it in the X-Correlation-Id response header.\n"
      schema:
        type: "string"
        maxLength: 100
  headers:
    XApiVersion:
      description: "API specification revision associated with this exchange within the stable /v1 contract. When the request included X-Api-Version, the receiver SHOULD echo that value.\n"
      schema:
        type: "string"
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
        maxLength: 32
    XCorrelationId:
      description: "Echo of the inbound X-Correlation-Id request header, or a receiver-generated value when the request did not carry one.\n"
      schema:
        type: "string"
        maxLength: 100
    RetryAfter:
      description: "Number of seconds the sender SHOULD wait before retrying the request."
      schema:
        type: "integer"
        minimum: 0
  responses:
    Accepted:
      description: "Event accepted for processing"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventAck"
          examples:
            accepted:
              summary: "Receipt acknowledgment"
              value:
                eventId: "3f2b9c14-8b0e-4f6a-9c31-6a1d2e5f7b80"
                status: "ACCEPTED"
                receivedTimestamp: "2026-09-01T14:32:11Z"
    BadRequest:
      description: "Invalid request (envelope/schema/required fields)"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Authentication required or failed"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Authenticated but not permitted"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "Idempotency conflict. The eventId has already been accepted from this sender with a materially different payload. An exact redelivery returns 202 with the original acknowledgment rather than this response.\n"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: "Unsupported Content-Type"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: "Request is syntactically valid but cannot be accepted for processing"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: "Throttled. The sender SHOULD retry after the interval given in Retry-After."
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: "Internal server error"
      headers:
        X-Api-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EventEnvelopeBase:
      type: "object"
      required:
        - "eventId"
        - "eventType"
        - "eventTimestamp"
        - "senderParticipantId"
        - "receiverParticipantId"
        - "payload"
      properties:
        eventId:
          type: "string"
          format: "uuid"
          maxLength: 36
          description: "Unique delivery identifier used for idempotency. SHALL be a UUID and SHALL be unique per sender. Receivers de-duplicate on the composite key (senderParticipantId, eventId).\n"
        eventType:
          type: "string"
          description: "Fully qualified event type name (e.g., insurance.annuity.beneficiary.proposed.v1). Concrete envelopes narrow this to a closed enum; see BeneficiaryEventEnvelope.\n"
        eventTimestamp:
          type: "string"
          format: "date-time"
          description: "Timestamp when this message was created for transmission by the originating system (UTC, ISO-8601 with 'Z' suffix). Distinct from payload.processedTimestamp, which records when the underlying business transaction was processed.\n"
        senderParticipantId:
          type: "string"
          minLength: 8
          maxLength: 8
          pattern: "^[0-9]{8}$"
          description: "Trading partner identifier of the sending organization. For NSCC participants, this value SHALL be the firm's NSCC Participant Number."
        receiverParticipantId:
          type: "string"
          minLength: 8
          maxLength: 8
          pattern: "^[0-9]{8}$"
          description: "Unique identifier for the carrier or distributor receiving this event. NSCC or DTCC participant ID."
        replayOfEventId:
          type: "string"
          format: "uuid"
          maxLength: 36
          description: "Reference to the eventId of the original transmission when this message is a replay. A replay SHALL carry a new eventId. Receivers SHALL treat a replay as a duplicate of the referenced event when that event was already applied.\n"
        payload:
          type: "object"
          description: "Domain-specific payload containing business data. Concrete shape is defined by domain-specific envelopes (e.g., BeneficiaryEvent)."
    BeneficiaryEventEnvelope:
      allOf:
        - $ref: "#/components/schemas/EventEnvelopeBase"
        - type: "object"
          properties:
            eventType:
              type: "string"
              enum:
                - "insurance.annuity.beneficiary.proposed.v1"
                - "insurance.annuity.beneficiary.booked.v1"
                - "insurance.annuity.beneficiary.rejected.v1"
              description: "Type of beneficiary event (PROPOSED, BOOKED, or REJECTED)."
            payload:
              allOf:
                - $ref: "#/components/schemas/BeneficiaryEvent"
              description: "Beneficiary event payload, discriminated on beneficiaryEventType. The payload's beneficiaryEventType SHALL correspond to the envelope eventType: proposed.v1 -> PROPOSED, booked.v1 -> BOOKED, rejected.v1 -> REJECTED. Receivers SHALL reject inconsistent events with beneficiary.transport.invalid-request.\n"
        - if:
            properties:
              eventType:
                const: "insurance.annuity.beneficiary.proposed.v1"
          then:
            properties:
              payload:
                properties:
                  beneficiaryEventType:
                    const: "PROPOSED"
        - if:
            properties:
              eventType:
                const: "insurance.annuity.beneficiary.booked.v1"
          then:
            properties:
              payload:
                properties:
                  beneficiaryEventType:
                    const: "BOOKED"
        - if:
            properties:
              eventType:
                const: "insurance.annuity.beneficiary.rejected.v1"
          then:
            properties:
              payload:
                properties:
                  beneficiaryEventType:
                    const: "REJECTED"
    BeneficiaryEvent:
      description: "Beneficiary event payload. Shape depends on beneficiaryEventType discriminator (PROPOSED, BOOKED, or REJECTED)."
      oneOf:
        - $ref: "#/components/schemas/BeneficiaryProposedEvent"
        - $ref: "#/components/schemas/BeneficiaryBookedEvent"
        - $ref: "#/components/schemas/BeneficiaryRejectedEvent"
      discriminator:
        propertyName: "beneficiaryEventType"
        mapping:
          PROPOSED: "#/components/schemas/BeneficiaryProposedEvent"
          BOOKED: "#/components/schemas/BeneficiaryBookedEvent"
          REJECTED: "#/components/schemas/BeneficiaryRejectedEvent"
    BeneficiaryEventBase:
      type: "object"
      required:
        - "beneficiaryEventId"
        - "beneficiaryTransactionId"
        - "beneficiaryEventType"
        - "sourceSystem"
        - "processedTimestamp"
        - "contract"
      properties:
        beneficiaryEventId:
          type: "string"
          maxLength: 64
          description: "Sender-assigned business identifier for this beneficiary event, opaque to the receiver. Used for audit and reconciliation; not used for idempotency.\n"
        beneficiaryTransactionId:
          type: "string"
          maxLength: 65
          description: "Business transaction identifier. When a BOOKED or REJECTED event represents the outcome of a previously submitted PROPOSED event, the same beneficiaryTransactionId SHALL be used to correlate the related events. For independently originated BOOKED events that are not associated with a prior PROPOSED event, the sender SHALL assign a unique beneficiaryTransactionId.\n"
        beneficiaryEventType:
          type: "string"
          enum:
            - "PROPOSED"
            - "BOOKED"
            - "REJECTED"
          description: "Business classification of the beneficiary event. SHALL correspond to the eventType in the enclosing event envelope according to the following mapping:

            \  insurance.annuity.beneficiary.proposed.v1 -> PROPOSED

            \  insurance.annuity.beneficiary.booked.v1 -> BOOKED

            \  insurance.annuity.beneficiary.rejected.v1 -> REJECTED

            Receivers SHALL reject events where eventType and beneficiaryEventType are inconsistent.\n"
        sourceSystem:
          type: "string"
          enum:
            - "DISTRIBUTOR"
            - "CARRIER"
          description: "Role of the originating system that created this event. An intermediary, hub, TPA or third-party platform transmits on behalf of a distributor or a carrier and SHALL use that participant's role. The originating channel is conveyed separately in requestorContext.submissionChannel.\n"
        processedTimestamp:
          type: "string"
          format: "date-time"
          description: "Timestamp when the underlying beneficiary transaction was processed in the originating system of record (UTC, ISO-8601 with 'Z' suffix). For BOOKED this is when the designation was recorded; for REJECTED, when the rejection was determined. SHALL be less than or equal to the envelope eventTimestamp.\n"
        requestorContext:
          $ref: "#/components/schemas/RequestorContext"
          description: "Context about the role and authority under which the beneficiary change was requested. requestorContext SHALL be present for PROPOSED events and MAY be omitted for BOOKED and REJECTED events."
        beneficiaryTypesInScope:
          type: "array"
          uniqueItems: true
          description: "Beneficiary types replaced by this request. Values SHALL be unique.

            Every beneficiaries[].beneficiaryType SHALL appear in this array. A receiver SHALL reject an event containing a beneficiary whose type is not in scope, using beneficiary.business.invalid-beneficiary.

            A type listed in scope with no corresponding entry in beneficiaries means all existing designations of that type are removed. Types not listed remain unchanged.

            On BOOKED events this array SHALL be present and the beneficiaries array SHALL represent the complete resulting designation set for the in-scope types only, not the full set of designations on the contract.\n"
          items:
            type: "string"
            enum:
              - "PRIMARY"
              - "CONTINGENT"
          minItems: 1
        contract:
          $ref: "#/components/schemas/Contract"
          description: "Policy contract information (contract number and optional associated firm ID)."
        beneficiaries:
          type: "array"
          description: "Array of beneficiary designations. Required on PROPOSED and BOOKED events. An empty array is valid when all existing designations for the in-scope beneficiary type or types are being removed. On REJECTED events this array, when present, echoes the rejected submission as received and SHALL NOT be interpreted as the carrier's system of record.\n"
          items:
            $ref: "#/components/schemas/Beneficiary"
    BeneficiaryProposedEvent:
      allOf:
        - $ref: "#/components/schemas/BeneficiaryEventBase"
        - type: "object"
          description: "PROPOSED communicates the requested resulting designation set for the beneficiary types listed in beneficiaryTypesInScope. The beneficiaries array MAY be empty when the request removes all existing designations for the in-scope type or types.\n"
          required:
            - "requestorContext"
            - "beneficiaryTypesInScope"
            - "beneficiaries"
          properties:
            beneficiaryEventType:
              type: "string"
              enum:
                - "PROPOSED"
              description: "Discriminator value for PROPOSED event type."
    BeneficiaryBookedEvent:
      allOf:
        - $ref: "#/components/schemas/BeneficiaryEventBase"
        - type: "object"
          description: "The BOOKED event SHALL represent the beneficiary designations recorded by the carrier after successful processing of the request. The beneficiaries array SHALL be the complete resulting designation set for the types listed in beneficiaryTypesInScope. The beneficiaries array MAY be empty when all designations for the in-scope type or types were removed. The carrier MAY normalize, enrich, or otherwise transform submitted data in accordance with carrier business rules. Changes that materially alter the business intent of the request SHOULD result in a REJECTED event rather than a modified BOOKED event. A BOOKED event MAY either: * represent successful processing of a previously

            \  submitted PROPOSED event, or

            * represent an independently initiated beneficiary

            \  change originating from carrier or distributor

            \  servicing channels outside this API workflow.\n"
          required:
            - "beneficiaryTypesInScope"
            - "beneficiaries"
          properties:
            beneficiaryEventType:
              type: "string"
              enum:
                - "BOOKED"
              description: "Discriminator value for BOOKED event type."
    BeneficiaryRejectedEvent:
      allOf:
        - $ref: "#/components/schemas/BeneficiaryEventBase"
        - type: "object"
          description: "REJECTED indicates the proposed beneficiary change was not accepted and was not applied. No beneficiary changes are considered effective. The rejection object SHALL contain the reason the request was rejected and any applicable field-level validation details. The beneficiaries array is optional on this event type; when present it SHALL be accompanied by beneficiaryTypesInScope, and every echoed beneficiaries[].beneficiaryType SHALL appear in beneficiaryTypesInScope. When beneficiaries is absent, beneficiaryTypesInScope MAY also be absent. The beneficiaries array, when present, echoes the rejected submission as received and SHALL NOT be interpreted as the carrier's current designations of record.\n"
          required:
            - "rejection"
          properties:
            beneficiaryEventType:
              type: "string"
              enum:
                - "REJECTED"
              description: "Discriminator value for REJECTED event type."
            rejection:
              $ref: "#/components/schemas/RejectionDetails"
              description: "Rejection details including code, message, and field-level errors."
    RequestorContext:
      type: "object"
      additionalProperties: false
      required:
        - "requestorRole"
      properties:
        requestorRole:
          type: "string"
          description: "Role or capacity of the party requesting the beneficiary change. POWER_OF_ATTORNEY and TRUSTEE require authorityType and authorityReference. AUTHORIZED_REPRESENTATIVE is intentionally exempt from that requirement; the supporting authority for that role is established during onboarding rather than per transaction. COURT_ORDER and GUARDIANSHIP authorityType values are expected on POWER_OF_ATTORNEY requests where a court has appointed the requestor.\n"
          enum:
            - "OWNER"
            - "POWER_OF_ATTORNEY"
            - "TRUSTEE"
            - "AUTHORIZED_REPRESENTATIVE"
        authorityType:
          type: "string"
          description: "Type of legal authority or documentation being relied upon when the requestor is acting on behalf of the owner. Required when requestorRole is POWER_OF_ATTORNEY or TRUSTEE. When requestorRole is TRUSTEE the value SHALL be TRUST_DOCUMENTATION.\n"
          enum:
            - "POA"
            - "TRUST_DOCUMENTATION"
            - "COURT_ORDER"
            - "GUARDIANSHIP"
            - "OTHER"
        authorityReference:
          type: "string"
          maxLength: 64
          description: "Sender-assigned reference identifying the legal authority documentation supporting the request (for example a POA document number, trust identifier, court order reference, guardianship case number, or internal document tracking ID). Required when requestorRole is POWER_OF_ATTORNEY or TRUSTEE. This field is intended for audit and reconciliation purposes and does not contain the authority document itself.\n"
        submissionChannel:
          type: "string"
          description: "Originating channel or system from which the beneficiary change request was submitted."
          enum:
            - "CLIENT_PORTAL"
            - "ADVISOR_PORTAL"
            - "MOBILE_APP"
            - "CALL_CENTER"
            - "PAPER"
            - "BATCH"
            - "API"
            - "THIRD_PARTY_PLATFORM"
            - "OTHER"
        requestedByPartyId:
          type: "string"
          maxLength: 64
          description: "Optional stable party identifier for the requestor when available (e.g., advisor ID, customer ID). Sender-assigned and opaque to the receiver.\n"
      allOf:
        - if:
            properties:
              requestorRole:
                const: "POWER_OF_ATTORNEY"
          then:
            required:
              - "authorityType"
              - "authorityReference"
        - if:
            properties:
              requestorRole:
                const: "TRUSTEE"
          then:
            properties:
              authorityType:
                const: "TRUST_DOCUMENTATION"
            required:
              - "authorityType"
              - "authorityReference"
    RejectionDetails:
      type: "object"
      additionalProperties: false
      required:
        - "rejectionCode"
        - "rejectionMessage"
      properties:
        rejectionCode:
          $ref: "#/components/schemas/BeneficiaryBusinessErrorCode"
          description: "Business error code classifying the rejection reason. Transport codes in the beneficiary.transport.* family SHALL NOT appear here; a rejection is always a terminal business outcome and is not retryable without correction. beneficiary.business.other SHALL be used only when no more specific standard business rejection code accurately applies.\n"
        rejectionMessage:
          type: "string"
          maxLength: 500
          description: "Human-readable rejection message explaining why the beneficiary change was not accepted."
        userMessage:
          type: "string"
          maxLength: 500
          description: "Safe, user-friendly message suitable for display to end users."
        timestamp:
          type: "string"
          format: "date-time"
          description: "Time when the rejection was determined (UTC, ISO-8601 with 'Z' suffix)."
        fieldErrors:
          type: "array"
          description: "Optional array of field-level validation errors encountered during processing."
          items:
            $ref: "#/components/schemas/BusinessFieldError"
    BusinessFieldError:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
      properties:
        path:
          type: "string"
          description: "Optional JSONPath-like pointer identifying the field with an error (e.g., $.beneficiaries[0].allocationPercentage), when applicable."
        code:
          $ref: "#/components/schemas/BeneficiaryBusinessErrorCode"
          description: "Structured business error code for this field error."
        message:
          type: "string"
          description: "Descriptive error message for this field."
    TransportFieldError:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
      properties:
        path:
          type: "string"
          description: "Optional JSONPath-like pointer identifying the field with an error (e.g., $.payload.beneficiaryEventType), when applicable."
        code:
          $ref: "#/components/schemas/BeneficiaryTransportErrorCode"
          description: "Structured transport error code for this field error."
        message:
          type: "string"
          description: "Descriptive error message for this field."
    Contract:
      type: "object"
      additionalProperties: false
      required:
        - "policyNumber"
      properties:
        policyNumber:
          type: "string"
          maxLength: 64
          description: "Unique policy number identifying the annuity contract, as assigned by the carrier. This field uses policyNumber to align with the approved style-guide terminology for the contract identifier.\n"
        associatedFirmId:
          type: "string"
          maxLength: 64
          description: "Optional identifier for the firm associated with this contract. Sender-assigned and opaque to the receiver unless a registry is agreed during onboarding.\n"
    Beneficiary:
      type: "object"
      additionalProperties: false
      required:
        - "beneficiaryType"
        - "relationshipType"
        - "allocationPercentage"
        - "name"
      properties:
        beneficiaryId:
          type: "string"
          maxLength: 64
          description: "Optional unique identifier for this beneficiary designation record, assigned by the system of record."
        beneficiaryType:
          type: "string"
          enum:
            - "PRIMARY"
            - "CONTINGENT"
          description: "Classification of beneficiary (PRIMARY, CONTINGENT)."
        relationshipType:
          type: "string"
          description: "These values are derived from DTCC standards and are intentionally preserved for interoperability. When multiple valid relationship codes apply, sender SHOULD use the most specific relationship code available. SELF, ALL_RELATIONSHIPS_ACCEPTABLE and ALL_BUT_SELF are retained for DTCC alignment but are product-eligibility rule codes. They SHALL NOT be sent on a beneficiary designation; receivers SHALL reject them with beneficiary.business.invalid-relationship.\n"
          enum:
            - "PARENT"
            - "CHILD"
            - "FATHER"
            - "MOTHER"
            - "SON"
            - "DAUGHTER"
            - "BROTHER"
            - "SISTER"
            - "EX_HUSBAND"
            - "EX_WIFE"
            - "STEP_MOTHER"
            - "STEP_FATHER"
            - "STEP_BROTHER"
            - "STEP_SISTER"
            - "GRANDFATHER"
            - "GRANDMOTHER"
            - "FATHER_IN_LAW"
            - "SIBLING"
            - "SON_IN_LAW"
            - "DAUGHTER_IN_LAW"
            - "BROTHER_IN_LAW"
            - "SISTER_IN_LAW"
            - "DOMESTIC_PARTNER"
            - "HALF_SISTER"
            - "COUSIN"
            - "SIGNIFICANT_OTHER"
            - "AUNT"
            - "NEPHEW"
            - "NIECE"
            - "SPOUSE"
            - "HUSBAND"
            - "WIFE"
            - "MOTHER_IN_LAW"
            - "HALF_BROTHER"
            - "UNCLE"
            - "DEPENDENT"
            - "EMPLOYEE"
            - "EMPLOYER"
            - "FIANCEE"
            - "FOSTER_PARENT"
            - "FRIEND"
            - "GRAND_CHILD"
            - "GRAND_PARENT"
            - "GUARDIAN"
            - "TRUSTEE"
            - "OTHER"
            - "OTHER_FAMILY"
            - "SELF"
            - "ALL_RELATIONSHIPS_ACCEPTABLE"
            - "ALL_BUT_SELF"
        relationshipDescription:
          type: "string"
          maxLength: 180
          description: "Free-form description of relationship. Required when relationshipType is OTHER or OTHER_FAMILY."
        designationSuccessionType:
          type: "string"
          enum:
            - "PER_CAPITA"
            - "PER_STIRPES"
          description: "Method for beneficiary distribution if a primary beneficiary predeceases (PER_CAPITA = equal per person; PER_STIRPES = by family line)."
        allocationPercentage:
          type: "number"
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: "Percentage of contract value allocated to this beneficiary. Allocation percentages for all beneficiaries of the same beneficiaryType SHALL sum to exactly 100.00"
        isIrrevocable:
          type: "boolean"
          description: "Indicates whether this beneficiary designation is irrevocable (cannot be changed without beneficiary consent)."
        dob:
          type: "string"
          format: "date"
          description: "Date of birth of the beneficiary (optional; may be required by carrier policy)."
        name:
          $ref: "#/components/schemas/BeneficiaryName"
          description: "Name of the beneficiary (individual or entity)."
        address:
          $ref: "#/components/schemas/Address"
          description: "Optional mailing or residential address for the beneficiary."
        phones:
          type: "array"
          description: "Optional array of phone numbers for the beneficiary."
          items:
            $ref: "#/components/schemas/Phone"
        emails:
          type: "array"
          description: "Optional array of email addresses for the beneficiary."
          items:
            $ref: "#/components/schemas/Email"
      allOf:
        - if:
            properties:
              relationshipType:
                enum:
                  - "OTHER"
                  - "OTHER_FAMILY"
          then:
            required:
              - "relationshipDescription"
    BeneficiaryName:
      type: "object"
      additionalProperties: false
      description: "Represents either an individual beneficiary or an entity beneficiary. Either firstName and lastName SHALL be provided for an individual, or entityName SHALL be provided for an entity beneficiary. Individual and entity naming formats are mutually exclusive.\n"
      properties:
        firstName:
          type: "string"
          minLength: 1
          maxLength: 105
          pattern: "^[^\\u0000-\\u001F\\u007F<>\\\\]{1,105}$"
          description: "First name of the individual beneficiary. Required when identifying an individual beneficiary. Unicode letters and combining marks are permitted so that accented and non-Latin legal names can be represented. Control characters, angle brackets and backslash are excluded.\n"
        middleName:
          type: "string"
          minLength: 1
          maxLength: 105
          pattern: "^[^\\u0000-\\u001F\\u007F<>\\\\]{1,105}$"
          description: "Middle name or initial of the individual beneficiary. Same character restrictions as firstName."
        lastName:
          type: "string"
          minLength: 1
          maxLength: 105
          pattern: "^[^\\u0000-\\u001F\\u007F<>\\\\]{1,105}$"
          description: "Last name or surname of the individual beneficiary. Required when identifying an individual beneficiary. Same character restrictions as firstName."
        entityName:
          type: "string"
          minLength: 1
          maxLength: 180
          pattern: "^[^\\u0000-\\u001F\\u007F<>\\\\]{1,180}$"
          description: "Legal name of the entity beneficiary (trust, organization, estate, etc.). Required when identifying an entity beneficiary. Same character restrictions as firstName."
      oneOf:
        - required:
            - "firstName"
            - "lastName"
        - required:
            - "entityName"
    Address:
      type: "object"
      additionalProperties: false
      required:
        - "addressType"
        - "addressLine1"
        - "city"
        - "country"
      properties:
        addressId:
          type: "string"
          maxLength: 100
          description: "Optional internal identifier for this address record."
        addressType:
          type: "string"
          maxLength: 30
          enum:
            - "RESIDENCE"
            - "BUSINESS"
            - "POBOXSEASONAL"
            - "APO"
            - "DPO"
            - "FPO"
          description: "Type of address. RESIDENCE = residential address; BUSINESS = business address; POBOXSEASONAL = a post office box or a seasonal mailing address; APO, DPO and FPO = United States military mailing addresses.\n"
        addressLine1:
          type: "string"
          maxLength: 100
          description: "Primary address line (street address, PO box, etc.)."
        addressLine2:
          type: "string"
          maxLength: 100
          description: "Secondary address line (apartment, suite, etc.)."
        addressLine3:
          type: "string"
          maxLength: 100
          description: "Tertiary address line (if needed)."
        addressLine4:
          type: "string"
          maxLength: 100
          description: "Quaternary address line (if needed)."
        addressLine5:
          type: "string"
          maxLength: 100
          description: "Quinary address line (if needed)."
        city:
          type: "string"
          maxLength: 100
          description: "City or municipality name."
        state:
          type: "string"
          maxLength: 2
          pattern: "^[A-Z]{2}$"
          description: "Two-character state or province code (uppercase). Required when country is US or CA."
        zipCode:
          type: "string"
          maxLength: 10
          pattern: "^[0-9A-Za-z -]{3,10}$"
          description: "Postal code (3-10 alphanumeric characters, may include hyphens or spaces). Required when country is US or CA."
        zipCodeExtension:
          type: "string"
          maxLength: 4
          pattern: "^[0-9A-Za-z]{1,4}$"
          description: "Extended postal code (e.g., +4 in US ZIP format)."
        country:
          type: "string"
          maxLength: 2
          pattern: "^[A-Z]{2}$"
          description: "Two-character ISO country code (uppercase)."
      allOf:
        - if:
            properties:
              country:
                enum:
                  - "US"
                  - "CA"
          then:
            required:
              - "state"
              - "zipCode"
    Phone:
      type: "object"
      additionalProperties: false
      required:
        - "countryCode"
        - "areaCode"
        - "dialNumber"
      properties:
        startDate:
          type: "string"
          format: "date"
          description: "Date this phone number became active."
        endDate:
          type: "string"
          format: "date"
          description: "Date this phone number ceased to be active."
        phoneType:
          type: "string"
          enum:
            - "MOBILE"
            - "HOME"
            - "BUSINESS"
            - "CLAIMCENTER"
            - "CUSTOMERSERVICE"
            - "CORPORATEOFFICE"
            - "FAX"
            - "UNKNOWN"
            - "OTHER"
          description: "Type or purpose of the phone number."
        countryCode:
          type: "string"
          pattern: "^\\+?[0-9]{1,3}$"
          description: "Country calling code (1-3 digits, may include leading +)."
        areaCode:
          type: "string"
          pattern: "^[0-9]{2,5}$"
          description: "Area or region code (2-5 digits; supports domestic and international numbering plans)."
        dialNumber:
          type: "string"
          pattern: "^[0-9]{4,12}$"
          description: "Main phone number digits (4-12 digits)."
        extension:
          type: "string"
          pattern: "^[A-Za-z0-9-]{1,10}$"
          description: "Optional phone extension or internal number."
        bestTime:
          type: "string"
          enum:
            - "MORNING"
            - "AFTERNOON"
            - "EVENING"
            - "ANYTIME"
          description: "Preferred time to contact the beneficiary."
        timezone:
          type: "string"
          description: "IANA timezone database identifier for the phone number (e.g., America/New_York)."
        isPreferred:
          type: "boolean"
          description: "Indicates whether this is the preferred phone number for the beneficiary."
        phoneId:
          type: "string"
          pattern: "^[A-Za-z0-9._-]{1,100}$"
          description: "Optional unique identifier for this phone record."
    Email:
      type: "object"
      additionalProperties: false
      required:
        - "emailAddress"
      properties:
        startDate:
          type: "string"
          format: "date"
          description: "Date this email address became active."
        endDate:
          type: "string"
          format: "date"
          description: "Date this email address ceased to be active."
        emailType:
          type: "string"
          enum:
            - "PERSONAL"
            - "BUSINESS"
            - "CUSTOMERSERVICE"
            - "OTHER"
          description: "Type or purpose of the email address."
        emailAddress:
          type: "string"
          format: "email"
          description: "Valid email address for the beneficiary."
        isPreferred:
          type: "boolean"
          description: "Indicates whether this is the preferred email address for the beneficiary."
        emailId:
          type: "string"
          pattern: "^[A-Za-z0-9._-]{1,100}$"
          description: "Optional unique identifier for this email record."
    EventAck:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "eventId"
        - "receivedTimestamp"
      properties:
        eventId:
          type: "string"
          format: "uuid"
          maxLength: 36
          description: "Echo of the request eventId. Used by the sender to correlate this acknowledgment with the submitted event. This acknowledgment confirms receipt and acceptance for processing only and does not indicate business acceptance of the beneficiary change."
        status:
          type: "string"
          enum:
            - "ACCEPTED"
          description: "Status of the event receipt (ACCEPTED = event has been accepted for processing)."
        receivedTimestamp:
          type: "string"
          format: "date-time"
          description: "Timestamp when the event was received by the system (UTC, ISO-8601 with 'Z' suffix)."
    ErrorResponse:
      type: "object"
      additionalProperties: false
      required:
        - "httpStatus"
        - "code"
        - "message"
      properties:
        httpStatus:
          type: "integer"
          description: "HTTP status code associated with this error."
          minimum: 400
          maximum: 599
        code:
          $ref: "#/components/schemas/BeneficiaryTransportErrorCode"
          description: "Transport error code describing why the request failed. Business rejection codes in the beneficiary.business.* family are never returned here; a business rejection is delivered as a REJECTED event, not as an HTTP error.\n"
        retryable:
          type: "boolean"
          description: "Indicates whether the sender may retry the identical request. True for beneficiary.transport.rate-limited and beneficiary.transport.internal-error; false for all other transport codes.\n"
        timestamp:
          type: "string"
          format: "date-time"
          description: "Time when the error occurred."
        message:
          type: "string"
          description: "Technical diagnostic message intended for developers and support teams."
        userMessage:
          type: "string"
          description: "Safe, user-friendly message suitable for display to end users."
        correlationId:
          type: "string"
          description: "Carries forward the inbound request's correlation ID header to enable end-to-end traceability."
        validationErrors:
          type: "array"
          description: "Array describing field-level transport or envelope validation failures. Each entry SHALL include a path, code, and message."
          items:
            $ref: "#/components/schemas/TransportFieldError"
    BeneficiaryTransportErrorCode:
      type: "string"
      description: "Transport and envelope error codes. Returned only in ErrorResponse.code and in TransportFieldError.code within ErrorResponse.validationErrors. Status and retry mapping:

        \  beneficiary.transport.invalid-request -> 400, not retryable

        \  beneficiary.transport.unauthorized -> 401, not retryable

        \  beneficiary.transport.forbidden -> 403, not retryable

        \  beneficiary.transport.duplicate-event-id -> 409, not retryable

        \  beneficiary.transport.unsupported-media-type -> 415, not retryable

        \  beneficiary.transport.unsupported-event-type -> 422, not retryable

        \  beneficiary.transport.unprocessable -> 422, not retryable

        \  beneficiary.transport.rate-limited -> 429, retryable

        \  beneficiary.transport.internal-error -> 500, retryable\n"
      enum:
        - "beneficiary.transport.invalid-request"
        - "beneficiary.transport.unsupported-media-type"
        - "beneficiary.transport.unsupported-event-type"
        - "beneficiary.transport.duplicate-event-id"
        - "beneficiary.transport.unauthorized"
        - "beneficiary.transport.forbidden"
        - "beneficiary.transport.rate-limited"
        - "beneficiary.transport.unprocessable"
        - "beneficiary.transport.internal-error"
    BeneficiaryBusinessErrorCode:
      type: "string"
      description: "Business rule error codes. Carried only in RejectionDetails.rejectionCode and in BusinessFieldError.code within a REJECTED event. All business codes are terminal; the sender SHALL correct the request rather than retry it unchanged. beneficiary.business.other is a constrained fallback and SHALL be used only when no existing standard business code accurately describes the rejection. When beneficiary.business.other is used, rejectionMessage SHALL describe the specific business reason, and repeated use SHOULD trigger governance review for a more specific standard code.\n"
      enum:
        - "beneficiary.business.contract-not-found"
        - "beneficiary.business.contract-not-eligible"
        - "beneficiary.business.pending-transaction-exists"
        - "beneficiary.business.allocation-invalid"
        - "beneficiary.business.invalid-beneficiary"
        - "beneficiary.business.invalid-relationship"
        - "beneficiary.business.irrevocable-constraint"
        - "beneficiary.business.other"
    BeneficiaryErrorCode:
      description: "Union of the transport and business error vocabularies, used where a field error may originate from either context. Codes use structured dotted identifiers: beneficiary.transport.* for transport/envelope and beneficiary.business.* for business rules.\n"
      oneOf:
        - $ref: "#/components/schemas/BeneficiaryTransportErrorCode"
        - $ref: "#/components/schemas/BeneficiaryBusinessErrorCode"
