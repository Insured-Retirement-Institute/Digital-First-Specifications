        isActionNeeded:
          description: Indicator that at least one section requires action
          type: boolean
        startDate:
          description: Start date
          type: string
          format: date
        endDate:
          description: End date
          type: string
          format: date
        reason:
          description: Reason suitability requires action
          type: string
