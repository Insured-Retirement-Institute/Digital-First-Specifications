openapi: 3.1.0
info:
  title: Annuity Application Status APIs
  description: APIs for managing Annuity application data including application status, details, transmission, agents, parties, funding, documents, and more.
  version: 4.0.0
  license:
    name: MIT
    url: https://github.com/Insured-Retirement-Institute/Pending-Case/blob/main/LICENSE
paths:
  /v4/application-statuses/searches:
    post:
      operationId: postApplicationStatusSearch
      summary: Search for summary application statuses
      description: |
        Retrieve summary application statuses based on search criteria.

        This endpoint uses offset-based pagination through the offset and limit query parameters.
        The data returned is not guaranteed to represent a moment-in-time snapshot of the data;
        concurrent writes may still affect results across pages. The caller must assume that, on
        occasion, some resources may be missing from the result set due to concurrent writes. The
        caller must also be prepared to handle the same resource appearing on multiple pages, and
        must de-duplicate the result set using policyNumber. Ordering by policyNumber with a
        consistent sortOrder provides the most stability across pages. The endpoint may return
        fewer resources than the requested limit.
      tags:
      - Application Status
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/orderBy'
      - $ref: '#/components/parameters/sortOrder'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSummaryApplicationStatusesRequest'
            example:
              policyNumber: P987654321
              cusip: 401B23458
              finishedCutoffDays: 7
        description: Search criteria. An empty or omitted body returns all application statuses.
      responses:
        '200':
          description: Policy application statuses successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryApplicationStatusesPagedResult"
              example:
                applicationStatuses:
                - policyNumber: P987654321
                  applicationOrigin:
                    platform: DigitalFirst
                    isElectronic: true
                    id: DF-APP-001234
                  cusip: 401B23458
                  productName: Secure Income Annuity Plus
                  isQualified: true
                  status: inProgress
                  statusDate: '2026-06-04'
                metadata:
                  offset: 0
                  limit: 100
                  totalCount: 1
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        '400':
          description: Bad Request - malformed or unrecognized search criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v4/application-statuses/{policyNumber}:
    get:
      operationId: getApplicationStatusByPolicyNumber
      summary: Retrieve application status
      description: Retrieve application status for a policy with complete status details.
      tags:
      - Application Status
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/policyNumber'
      - $ref: '#/components/parameters/associatedFirmId'
      responses:
        "200":
          description: Policy application status successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailApplicationStatus"
              example:
                policyNumber: P987654321
                applicationOrigin:
                  platform: DigitalFirst
                  isElectronic: true
                  id: DF-APP-001234
                cusip: 401B23458
                productName: Secure Income Annuity Plus
                isQualified: true
                status: inProgress
                statusDate: '2026-06-04'
                isActionNeeded: true
                actionSections:
                - suitability
                canSellValidation:
                  status: completed
                  isActionNeeded: false
                documentReview:
                  status: awaitingReview
                  isActionNeeded: false
                suitability:
                  status: inProgress
                  isActionNeeded: true
                  startDate: '2026-06-04'
                  dueDate: '2026-06-11'
                  reason: moreInformationNeeded
                  note: Client financial profile documentation required
                funding:
                  status: awaitingReview
                  isActionNeeded: false
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        "400":
          description: Bad Request - malformed or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v4/application-statuses/policies:
    get:
      operationId: getPolicies
      summary: Retrieve policies
      description: |
        Retrieve all policies.

        This endpoint uses offset-based pagination through the offset and limit query parameters.
        The data returned is not guaranteed to represent a moment-in-time snapshot of the data;
        concurrent writes may still affect results across pages. The caller must assume that, on
        occasion, some resources may be missing from the result set due to concurrent writes. The
        caller must also be prepared to handle the same resource appearing on multiple pages, and
        must de-duplicate the result set using policyNumber. Ordering by policyNumber with a
        consistent sortOrder provides the most stability across pages. The endpoint may return
        fewer resources than the requested limit.
      tags:
      - Policy
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/associatedFirmId'
      - $ref: '#/components/parameters/cusip'
      - $ref: '#/components/parameters/producerNumber'
      - $ref: '#/components/parameters/npn'
      - $ref: '#/components/parameters/commissionSplitPercent'
      - $ref: '#/components/parameters/crdNumber'
      - $ref: '#/components/parameters/applicationOriginId'
      - $ref: '#/components/parameters/trackingNumber'
      - $ref: '#/components/parameters/finishedCutoffDays'
      - $ref: '#/components/parameters/orderBy'
      - $ref: '#/components/parameters/sortOrder'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        "200":
          description: Policies successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliciesPagedResult"
              example:
                policies:
                - policyNumber: P987654321
                  applicationOrigin:
                    platform: DigitalFirst
                    isElectronic: true
                    id: DF-APP-001234
                  cusip: 401B23458
                  productName: Secure Income Annuity Plus
                  isQualified: true
                  status: inProgress
                  statusDate: '2026-06-04'
                metadata:
                  offset: 0
                  limit: 100
                  totalCount: 1
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        "400":
          description: Bad Request - malformed or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v4/application-statuses/policies/{policyNumber}:
    get:
      operationId: getPolicyByPolicyNumber
      summary: Retrieve a policy
      description: Retrieve summary application-status of a policy without the details of the statuses of each activity associated with the application
      tags:
      - Policy
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/policyNumber'
      - $ref: '#/components/parameters/associatedFirmId'
      responses:
        "200":
          description: Policy successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
              example:
                policyNumber: P987654321
                applicationOrigin:
                  platform: DigitalFirst
                  isElectronic: true
                  id: DF-APP-001234
                cusip: 401B23458
                productName: Secure Income Annuity Plus
                isQualified: true
                status: inProgress
                statusDate: '2026-06-04'
                isActionNeeded: true
                actionSections:
                - suitability
                signedDate: '2026-06-01'
                receivedDate: '2026-06-02'
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        "400":
          description: Bad Request - malformed or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v4/application-statuses/policies/{policyNumber}/fundings:
    get:
      operationId: getFundingStatusByPolicyNumber
      summary: Retrieve policy funding data
      description: Retrieve funding data of a policy.
      tags:
      - Policy
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/policyNumber'
      - $ref: '#/components/parameters/associatedFirmId'
      responses:
        "200":
          description: Policy funding successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Funding"
              example:
                status: inProgress
                isActionNeeded: true
                startDate: '2026-06-06'
                sources:
                - fundingMethod: anotherPolicy
                  contributionType: full1035Exchange
                  isActionNeeded: true
                  anticipatedAmount: 250000.0
                  status: inProgress
                  cedingCompanyName: Legacy Life Insurance Co
                  accountNumber: POL-123456789
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        "400":
          description: Bad Request - malformed or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v4/application-statuses/policies/{policyNumber}/document-reviews:
    get:
      operationId: getDocumentReviewStatusByPolicyNumber
      summary: Retrieve policy document review data
      description: Retrieve document review data of a policy.
      tags:
      - Policy
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/policyNumber'
      - $ref: '#/components/parameters/associatedFirmId'
      responses:
        "200":
          description: Policy document review successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentReview"
              example:
                status: inProgress
                isActionNeeded: true
                startDate: '2026-06-05'
                issues:
                - reason: missingSignature
                  formName: Application for Annuity
                  formNumber: APP-1001
                  dueDate: '2026-06-12'
                  note: Owner signature required on page 3
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        "400":
          description: Bad Request - malformed or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v4/application-statuses/policies/{policyNumber}/suitability:
    get:
      operationId: getSuitabilityInformationByPolicyNumber
      summary: Retrieve policy suitability data
      description: Retrieve suitability data of a policy.
      tags:
      - Policy
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/policyNumber'
      - $ref: '#/components/parameters/associatedFirmId'
      responses:
        "200":
          description: Policy suitability successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suitability"
              example:
                status: inProgress
                isActionNeeded: true
                startDate: '2026-06-04'
                dueDate: '2026-06-11'
                reason: moreInformationNeeded
                note: Client financial profile documentation required
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        "400":
          description: Bad Request - malformed or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v4/application-statuses/policies/{policyNumber}/can-sell-validations:
    get:
      operationId: getCanSellValidationByPolicyNumber
      summary: Retrieve policy can sell validation data
      description: Retrieve can sell validation data of a policy.
      tags:
      - Policy
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/brokerNumber'
      - $ref: '#/components/parameters/policyNumber'
      - $ref: '#/components/parameters/associatedFirmId'
      responses:
        "200":
          description: Policy can sell validation successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanSellValidation"
              example:
                status: inProgress
                isActionNeeded: true
                startDate: '2026-06-03'
                issues:
                - issueType: trainingExpired
                  note: Producer training expired on 2026-05-01
                  affectedProducer:
                    npn: '1234567890'
          headers:
            correlationId:
              $ref: '#/components/headers/correlationId'
            X-Api-Version:
              $ref: '#/components/headers/X-Api-Version'
        "400":
          description: Bad Request - malformed or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    correlationId:
      name: correlationId
      description: Optional client-supplied identifier to trace the request.
      in: header
      required: false
      schema:
        type: string
    brokerNumber:
      name: brokerNumber
      description: Optional custom header identifying the broker number of the call
      in: header
      required: false
      schema:
        type: string
    policyNumber:
      name: policyNumber
      description: Policy number
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
        pattern: '^(?!policies$)(?!searches$).+$'
    associatedFirmId:
      name: associatedFirmId
      description: Optional parameter for the associated firm ID used to further identify a firm who is doing business on behalf of multiple distribution firms.
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 65
    cusip:
      name: cusip
      description: Optional query parameter for the CUSIP
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/cusip'
    producerNumber:
      name: producerNumber
      description: Carrier-assigned unique identifier for the producer.
      in: query
      required: false
      schema:
        type: string
        maxLength: 30
    npn:
      name: npn
      description: The unique National Producer Number that is assigned to an individual producer at the NAIC level that is used as the standard global identifier across all states.
      in: query
      required: false
      schema:
        type: string
        maxLength: 10
    commissionSplitPercent:
      name: commissionSplitPercent
      description: Represents the percentage share of total commission allocated to the producer, used when multiple producers are associated with the policy.
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 100
    crdNumber:
      name: crdNumber
      description: Optional query parameter for the Central Registration Depository number
      in: query
      required: false
      schema:
        type: string
        maxLength: 10
    applicationOriginId:
      name: applicationOriginId
      description: Optional query parameter for the application origin ID
      in: query
      required: false
      schema:
        type: string
    trackingNumber:
      name: trackingNumber
      description: Optional query parameter for the delivery tracking number
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 65
    finishedCutoffDays:
      name: finishedCutoffDays
      description: Optional query parameter for when a completed or cancelled policy is to drop off
      in: query
      required: false
      schema:
        type: integer
        default: 7
    orderBy:
      name: orderBy
      description: 'Field name used to order resources in the result set. Ordering by policyNumber provides the most stability across pages, because it is unique and stable; statusDate is not unique and may reorder between requests.'
      in: query
      required: false
      schema:
        type: string
        enum: [policyNumber, status, statusDate]
        default: statusDate
    sortOrder:
      name: sortOrder
      description: Whether resources are ordered in ascending (asc) or descending (desc) order.
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    offset:
      name: offset
      description: Zero-based index of the first resource to return, matching offset in the response metadata.
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    limit:
      name: limit
      description: Maximum number of resources to return per page. The endpoint may return fewer resources than requested.
      in: query
      required: false
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
  schemas:
    cusip:
      description: CUSIP
      type: string
      minLength: 9
      maxLength: 9
      pattern: ^[0-9]{3}[A-Z0-9]{5}[0-9]$
    IndividualIdentity:
      description: Schema for individual identity data
      required:
      - type
      - firstName
      - lastName
      type: object
      properties:
        type:
          description: Indicates whether the party is an individual or an entity.
          type: string
          const: individual
        firstName:
          description: First name of the individual
          type: string
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9À-ſ=()*@#\s.,''_/~%$!();:&"®`\-\\?]{1,105}$'
        middleName:
          description: The middle name of the individual
          type: string
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9À-ſ=()*@#\s.,''_/~%$!();:&"®`\-\\?]{1,105}$'
        lastName:
          description: The last name of the individual
          type: string
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9À-ſ=()*@#\s.,''_/~%$!();:&"®`\-\\?]{1,105}$'
        taxId:
          description: Party's tax identification number
          allOf:
          - $ref: '#/components/schemas/taxId'
    IndividualProducer:
      description: Schema for individual producer data
      type: object
      required: [relationships]
      allOf:
      - $ref: "#/components/schemas/IndividualIdentity"
      - type: object
        properties:
          npn:
            description: The unique National Producer Number that is assigned to an individual producer at the NAIC level that is used as the standard global identifier across all states.
            type: string
            maxLength: 10
          commissionSplitPercent:
            description: Represents the percentage share of total commission allocated to the producer, used when multiple producers are associated with the policy.
            type: number
            minimum: 0
            maximum: 100
          crdNumber:
            description: The Central Registration Depository (CRD) number assigned by FINRA to identify the financial professional.
            type: string
            maxLength: 10
          relationships:
            description: 'Relationship(s) this producer has to the policy: primaryAgent, secondaryAgent, additionalAgent, investmentAdvisorRepresentative'
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items:
              type: string
              enum:
              - primaryAgent
              - secondaryAgent
              - additionalAgent
              - investmentAdvisorRepresentative
    IndividualParty:
      description: Schema for individual party data
      type: object
      allOf:
      - $ref: "#/components/schemas/IndividualIdentity"
      - $ref: "#/components/schemas/PartyRelationship"
    EntityIdentity:
      description: Schema for entity identity data
      type: object
      required: [type, name]
      properties:
        type:
          description: Indicates whether the party is an individual or an entity.
          type: string
          const: entity
        name:
          description: Name of the entity
          type: string
          minLength: 1
          maxLength: 180
          pattern: '^[a-zA-Z0-9À-ſ=()*@#\s.,''_/~%$!();:&"®`\-\\?]{1,180}$'
        taxId:
          description: Party's tax identification number
          allOf:
          - $ref: '#/components/schemas/taxId'
    EntityProducer:
      description: Schema for entity producer data
      type: object
      required: [relationships]
      allOf:
      - $ref: "#/components/schemas/EntityIdentity"
      - type: object
        properties:
          npn:
            description: The unique National Producer Number that is assigned to an individual producer at the NAIC level that is used as the standard global identifier across all states.
            type: string
            maxLength: 10
          commissionSplitPercent:
            description: Represents the percentage share of total commission allocated to the producer, used when multiple producers are associated with the policy.
            type: number
            minimum: 0
            maximum: 100
          crdNumber:
            description: The Central Registration Depository (CRD) number assigned by FINRA to identify the financial professional.
            type: string
            maxLength: 10
          relationships:
            description: 'Relationship(s) this producer has to the policy: brokerageGeneralAgency, registeredInvestmentAdvisoryFirm, independentMarketingOrganization, brokerDealer'
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items:
              type: string
              enum:
              - brokerageGeneralAgency
              - registeredInvestmentAdvisoryFirm
              - independentMarketingOrganization
              - brokerDealer
    EntityParty:
      description: Schema for entity party data
      type: object
      allOf:
      - $ref: "#/components/schemas/EntityIdentity"
      - $ref: "#/components/schemas/PartyRelationship"
    PartyRelationship:
      description: Schema for party relationship data
      type: object
      required: [relationships]
      properties:
        relationships:
          description: 'Relationship(s) this party has to the policy: owner, jointOwner, annuitant, jointAnnuitant, primaryBeneficiary, contingentBeneficiary'
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum:
            - owner
            - jointOwner
            - annuitant
