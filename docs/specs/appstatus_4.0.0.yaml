        startDate:
          description: Start date
          type: string
          format: date
        endDate:
          description: End date
          type: string
          format: date
        note:
          description: Note about the document review
          type: string
          minLength: 1
          maxLength: 2000
        issues:
          description: List of issues that need to be addressed
          type: array
          items:
            type: object
            required:
            - reason
            properties:
              reason:
                description: Reason the document review issue was raised
                type: string
