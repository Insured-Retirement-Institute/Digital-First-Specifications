                format: date
              note:
                description: Note about the document review issue
                type: string
                minLength: 1
                maxLength: 2000
    Funding:
      description: Schema for policy funding data
      type: object
      required: [isActionNeeded, status]
      properties:
        startDate:
          description: Start date
          type: string
          format: date
        endDate:
          description: End date
          type: string
          format: date
        isActionNeeded:
          description: Indicator that at least one section requires action
          type: boolean
        status:
          description: Funding status
          type: string
          enum: [awaitingReview, inProgress, completed]
        note:
          description: Note about the funding
          type: string
          minLength: 1
          maxLength: 2000
        sources:
          description: Lists sources of funding
          type: array
          items:
            type: object
            required:
            - fundingMethod
            - contributionType
            properties:
              fundingMethod:
                description: Method used to fund/transfer this source
                type: string
                enum:
                - anotherPolicy
                - check
                - clearinghouse
                - creditCard
                - debitCard
                - digitalPayment
                - electronicFundTransfer
                - payrollDeduction
                - wireTransfer
              contributionType:
                description: Type of funding contribution
                type: string
                enum:
                - contribution
                - directRollover
                - employeeContribution
                - employerContribution
                - full1035Exchange
                - indirectRollover
                - nonQualifiedTransferOfAssets
                - partial1035Exchange
                - qualifiedTransfer
              isActionNeeded:
                description: Indicator that this funding source requires action
                type: boolean
              anticipatedAmount:
                description: Anticipated amount
                type: number
                format: double
              receivedAmount:
                description: Received amount
                type: number
                format: double
              receivedDate:
                description: Received date
                type: string
                format: date
              status:
                description: Status of the funding source
                type: string
                enum:
                - awaitingReview
                - inProgress
                - completed
              reason:
                description: Reason the funding is delayed or flagged
                type: string
                enum:
                - awaitingFundsFromCedingCompany
                - contactCarrier
                - fundingDiscrepancy
                - nigoAtCedingCarrier
                - noFundsReceivedCash
                - pendingReg60
                - other
              effectiveDate:
                description: Effective date of the funding source
                type: string
                format: date
              note:
                description: Note about the funding source
                type: string
                minLength: 1
                maxLength: 2000
              cedingCompanyName:
                description: Name of the company holding the existing contract to be replaced.
                type: string
                minLength: 1
                maxLength: 180
                pattern: '^[a-zA-Z0-9À-ſ=()*@#\s.,''_/~%$!();:&"®`\-\\?]{1,180}$'
              accountNumber:
                description: Ceding company account number
                type: string
              startDate:
                description: Start date
                type: string
                format: date
              referenceNumber:
                description: Reference number
                type: string
              nextActivityDate:
                description: Next activity date
                type: string
                format: date
              methodOfInitiation:
                description: Initiation method
                type: string
                enum: [fax, email, mail, replacement]

    PolicySummary:
      description: Schema for policy summary data
      type: object
      required: [policyNumber, applicationOrigin, cusip, status, statusDate]
      properties:
        isActionNeeded:
          description: Indicator that at least one section requires action
          type: boolean
        actionSections:
          description: Sections that require action. Required, and must contain at least one section, if isActionNeeded is true.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - suitability
            - canSellValidation
            - documentReview
            - funding
        policyNumber:
          description: Policy number
          type: string
          minLength: 1
          maxLength: 30
        associatedFirmId:
          description: Optional query parameter for the associated firm ID used to further identify a firm who is doing business on behalf of multiple distribution firms.
          type: string
        applicationOrigin:
          description: Platform of application origin
          type: object
          properties:
            platform:
              description: Platform of application origin
              type: string
              maxLength: 50
            isElectronic:
              description: Is application electronic?
              type: boolean
            id:
              description: ID of application origin
              type: string
              maxLength: 65
          required:
          - isElectronic
        cusip:
          description: CUSIP
          $ref: '#/components/schemas/cusip'
        productName:
          description: Product name
          type: string
          maxLength: 180
        isQualified:
          description: Is policy tax plan qualified?
          type: boolean
        status:
          description: Application status
          type: string
          enum: [received, inProgress, completed, cancelled]
        statusDate:
          description: Date of the application status
          type: string
          format: date
        delivery:
          description: Pertains to delivery of the issued policy/contract
          type: object
          properties:
            sentDate:
              description: Delivery sent date
              type: string
              format: date
            method:
              description: Delivery method
              type: string
              enum:
              - fedex
              - ups
              - electronicDelivery
              - handDelivery
              - usps
            trackingNumber:
              description: Delivery tracking number
              type: string
        caseManager:
          description: Case manager
          type: object
          required: [fullName, phoneNumber]
          properties:
            fullName:
              description: Full name of case manager
              type: string
              minLength: 1
              maxLength: 180
              pattern: '^[a-zA-Z0-9À-ſ=()*@#\s.,''_/~%$!();:&"®`\-\\?]{1,180}$'
            phoneNumber:
              description: Phone number of the party.
              type: string
              minLength: 10
              maxLength: 15
              pattern: '^[0-9+()\-.\s]{10,15}$'
            emailAddress:
              description: Email address of the party.
              type: string
              format: email
            websiteUrl:
              description: Website URL of case manager
              type: string
              format: uri
        producers:
          $ref: "#/components/schemas/Producers"
        parties:
          $ref: "#/components/schemas/Parties"
    Policy:
      description: Schema for policy data
      type: object
      allOf:
      - $ref: '#/components/schemas/PolicySummary'
      - if:
          properties:
            isActionNeeded:
              const: true
          required:
          - isActionNeeded
        then:
          required:
          - actionSections
      properties:
        isActionNeeded:
          description: Indicator that at least one section requires action
          type: boolean
        actionSections:
          description: Sections that require action. Required, and must contain at least one section, if isActionNeeded is true.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - suitability
            - canSellValidation
            - documentReview
            - funding
        signedDate:
          description: Signed date of policy
          type: string
          format: date
        receivedDate:
          description: Received date
          type: string
          format: date
        issuedDate:
          description: Issued date of policy
          type: string
          format: date
        effectiveDate:
          description: Effective date of policy
          type: string
          format: date
        rateEffectiveDate:
          description: Rate effective date of policy
          type: string
          format: date
        fundsHeldUntilDate:
          description: Funds held until date
          type: string
          format: date
        cancellation:
          description: Details about the policy cancellation
          type: object
          required: [initiator, cancelledDate]
          properties:
            initiator:
              description: Who initiated cancellation
              type: string
              enum:
              - producer
              - carrier
              - client
            cancelledDate:
              description: Cancellation date
              type: string
              format: date
            reason:
              description: Reason for the cancellation
              type: string
              enum:     
              - clientRequest
              - duplicate
              - policyCannotBeVerified
              - addedInError
              - suitabilityDecline
              - notInGoodOrder
            notes:
              description: Additional notes regarding the cancellation
              type: string
              minLength: 1
              maxLength: 2000
