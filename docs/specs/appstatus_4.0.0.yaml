          - moreInformationNeeded
          - notSuitableForClient
          - other
        note:
          description: Note about the suitability review
          type: string
          minLength: 1
          maxLength: 2000
        dueDate:
          description: Due date
          type: string
          format: date
        isApproved:
          description: If status is completed, this field denotes whether suitability was approved or declined
          type: boolean
    DocumentReview:
      description: Schema for policy document review data
      type: object
      required: [status, isActionNeeded]
      properties:
        status:
          description: Document review status
          type: string
          enum: [awaitingReview, inProgress, completed]
        isActionNeeded:
          description: Indicator that at least one section requires action
