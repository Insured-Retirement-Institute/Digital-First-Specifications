            entity: '#/components/schemas/EntityParty'
    CanSellValidation:
      description: Schema for policy can sell validation data
      type: object
      required: [status, isActionNeeded]
      properties:
        status:
          description: Validation status
          type: string
          enum: [awaitingReview, inProgress, completed]
        isActionNeeded:
          description: Indicator that at least one section requires action
          type: boolean
        startDate:
          description: Start date
          type: string
          format: date
        endDate:
          description: End date
          type: string
          format: date
        note:
          description: Note about the can-sell validation
          type: string
          minLength: 1
          maxLength: 2000
        issues:
          description: List of issues that need to be addressed
          type: array
          items:
            type: object
            required:
            - issueType
            properties:
              issueType:
                description: Type of can-sell issue
                type: string
                enum:
                - trainingIncompleteMissing
                - trainingExpired
                - agentNotAppointedForSale
                - jitAppointmentInProgress
                - agentNotLicensed
                - other
              note:
                description: Note about the issue
                type: string
                minLength: 1
                maxLength: 2000
              affectedProducer:
                description: Producer for which the CanSell issue exists
                type: object
                properties:
                  npn:
                    description: The unique National Producer Number that is assigned to an individual producer at the NAIC level that is used as the standard global identifier across all states.
                    type: string
                    maxLength: 10
                  commissionSplitPercent:
                    description: Represents the percentage share of total commission allocated to the producer, used when multiple producers are associated with the policy.
                    type: number
                    minimum: 0
                    maximum: 100
                  crdNumber:
                    description: The Central Registiration Depository (CRD) number assigned by FINRA to identify the financial professional.
                    type: string
                    maxLength: 10
                  taxId:
                    description: Party's tax identification number
                    allOf:
                    - $ref: '#/components/schemas/taxId'
    Suitability:
      description: Schema for policy suitability data
