                  code compatibility.
              accruedInterest:
                description: Accrued interest amount on the fund/sub-account (if carrier provides).
                type: number
                minimum: 0
                maximum: 9999999999.99
              thresholdPercent:
                description: threshold percent used with threshold strategies.
                type: number
                minimum: 0
                maximum: 9999999999.99
              rateTier:
                description: Rate tiering details (tier thresholds and applied tier).
                type: object
                required:
                - indexReturnPercent
                - tieredRate
                - rateType
                properties:
                  indexReturnPercent:
                    description: The return rate calculated using the current index benchmark value and initial index benchmark value.
                    type: number
                    minimum: 0
                    maximum: 100
                  tieredRate:
                    description: Rate that pays interest at increasingly higher rates as the account balance increases.
                    type: number
                    minimum: 0
                    maximum: 9999999999.99
                  rateType:
                    description: Identifies the type of rate that has been locked for the fund or sub‑account.
                    type: string
                    enum:
                    - PARTICIPATION
                    - DOWNSIDE_PARTICIPATION
              fundSegments:
                description: Represents segment-level details within a fund.
                type: array
                items:
                  type: object
                  required:
                  - segmentId
                  - fundId
                  - originalDepositAmount
                  - originalDepositDate
                  - depositDate
                  - depositAmount
                  - currentAmount
                  - renewalDate
                  - numberOfUnits
                  - sweepAccountId
                  - startDate
                  - endDate
                  properties:
                    segmentId:
                      description: Segment identifier.
                      type: string
                      pattern: ^[A-Za-z0-9._-]{1,100}$
                    fundId:
                      description: Fund identifier
                      type: string
                      maxLength: 200
                      pattern: ^[A-Za-z0-9._-]{1,50}$
                    originalDepositAmount:
                      description: Original deposit amount for the segment.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    originalDepositDate:
                      desscription: Indicates the original date on which the segment investment was create.
                      type: string
                      format: date
                    depositDate:
                      description: Represents the date on which funds were allocated to the segment.
                      type: string
                      format: date
                    depositAmount:
                      description: Specifies the amount allocated to the segment during a deposit or allocation event.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    currentAmount:
                      description: Represents the current value of the segment, including any gains, losses, or credited interest since the original deposit.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    renewalDate:
                      description: Indicates the date on which the segment completes its current investment term and resets or renews.
                      type: string
                      format: date
                    numberOfUnits:
                      description: Number of units (if applicable).
                      type: number
                      minimum: 0
                    sweepAccountId:
                      description: Identifies the associated sweep account or holding account where funds may automatically move before or after allocation to segments.
                      type: string
                      pattern: ^[A-Za-z0-9._-]{1,100}$
                    interestEarningAmount:
                      description: Represents the portion of the segment balance that is eligible for interest crediting based on the product’s crediting methodology.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    appliedInterestRate:
                      description: Specifies the interest rate applied to the segment for calculating credited earnings during the segment term.
                      type: number
                      minimum: 0
                      maximum: 100
                    startingPrice:
                      description: Represents the index or benchmark value at the start of the segment term.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    startingPriceDate:
                      description: Indicates the date on which the starting index or benchmark value was recorded for the segment.
                      type: string
                      format: date
                    endingPrice:
                      description: Represents the index or benchmark value at the end of the segment.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    endingPriceDate:
                      description: Represents the date on which the ending index or benchmark value was captured for the segment.
                      type: string
                      format: date
                    startDate:
                      description: The date when the systematic program begins executing payments or transfers (entered by user).
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date
                    maxPrice:
                      description: Maximum index price observed in segment period.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    maxPriceDate:
                      description: Indicates the date on which the maximum index or benchmark value occurred during the segment term.
                      type: string
                      format: date
              rateLockInfo:
                type: object
                description: Required when `isLockFeatureEnabled` is true.
                properties:
                  rateType:
                    description: Identifies the type of rate that has been locked for the fund or sub‑account.
                    type: string
                    maxLength: 100
                  lockStartDate:
                    description: The calendar date on which the rate lock becomes effective. From this date forward, the fund’s rate or crediting method remains fixed for the duration of the lock period. Formatted as YYYY‑MM‑DD.
                    type: string
                    format: date
                  lockEndDate:
                    description: The calendar date on which the rate lock expires. After this date, the crediting rate or method may reset or adjust according to product rules. Formatted as YYYY‑MM‑DD.
                    type: string
                    format: date
                  lockPeriod:
                    description: The total duration of the applied rate lock, expressed as a number of days. Represents the full length of time from lockStartDate through lockEndDate during which the rate remains fixed.
                    type: number
                    minimum: 0
                required:
                - rateType
                - lockStartDate
                - lockEndDate
            allOf:
            - if:
                properties:
                  isTransferSendAllowed:
                    description: Indicates whether funds can be transferred into this fund based on restrictions, or fund status.
                    const: false
                required:
                - isTransferSendAllowed
              then:
                required:
                - transferSendRestrictInfo
              else:
                not:
                  required:
                  - transferSendRestrictInfo
            - if:
                properties:
                  isTransferDestAllowed:
                    description: Indicates whether funds can be transferred out of this fund based on fund-level restrictions.
                    const: false
                required:
                - isTransferDestAllowed
              then:
                required:
                - transferDestRestrictInfo
              else:
                not:
                  required:
                  - transferDestRestrictInfo
            - if:
                properties:
                  isLockFeatureEnabled:
                    description: True if the fund has a lock feature enabled (rate lock/index lock).  If this is true then rateLockInfo value is required, else it is not required.
                    const: true
                required:
                - isLockFeatureEnabled
              then:
                required:
                - rateLockInfo
              else:
                not:
                  required:
                  - rateLockInfo
    PartiesList:
      type: object
      properties:
        startIndex:
          description: Zero-based index of the first record to return.
          type: integer
          minimum: 0
        itemsCount:
          description: Number of records included in the current response page.
          type: integer
          minimum: 0
        totalItemsCount:
          description: Total number of records available that match the request criteria, independent of pagination.
          type: integer
          minimum: 0
        parties:
          description: Represents all individuals or entities associated with the policy, including their identity, relationship to the contract, and role in policy servicing or benefit distribution.
          type: array
          items:
            $ref: '#/components/schemas/Party'
    Party:
      description: The parties object represents policy parties such as owners, annuitants,
        beneficiaries, payees, trustees, and agents, together with their identity,
        relationship, and servicing instructions.
      type: object
      allOf:
      - type: object
        properties:
          paymentForm:
            description: Party-level payment form. `EXCHANGE` is retained only for party-level exchange servicing scenarios; recurring disbursement schemas intentionally use the narrower ACH/EFT/CHECK/WIRE/DTCC vocabularies.
            type: string
            enum:
            - DTCC
            - ACH
            - CHECK
            - WIRE
            - EXCHANGE
          allocationPercentage:
            description: Specifies the percentage share of benefits, proceeds, or transaction allocation assigned to the party
            type: number
            minimum: 0
            maximum: 100
          bank:
            description: Financial institution details.
            $ref: '#/components/schemas/Bank'
          address:
            description: Physical or mailing address details.
            $ref: '#/components/schemas/Address'
          phones:
            description: Phone details
            type: array
            items:
              $ref: '#/components/schemas/Phone'
          emails:
            description: Email details
            type: array
            items:
              $ref: '#/components/schemas/Email'
          identifications:
            description: Identifications
            type: array
            items:
              $ref: '#/components/schemas/Identification'
          taxWithholdingInstructions:
            description: List of tax withholding instruction entries.
            type: array
            items:
              $ref: '#/components/schemas/TaxWithholdingInstruction'
          deathDetails:
            description: Details regarding the death of the insured/annuitant
            $ref: '#/components/schemas/DeathDetails'
      - anyOf:
        - $ref: '#/components/schemas/IndividualParty'
        - $ref: '#/components/schemas/EntityParty'
      - if:
          properties:
            paymentForm:
              description: Party-level payment form. `EXCHANGE` is retained only for party-level exchange servicing scenarios; recurring disbursement schemas intentionally use the narrower ACH/EFT/CHECK/WIRE/DTCC vocabularies.
              enum:
              - ACH
              - WIRE
              - DTCC
          required:
          - paymentForm
        then:
          required:
          - bank
    PolicyProducers:
      type: object
      properties:
        producers:
          description: Represents the set of producers associated with the policy, including their identifying information and commission-related attributes
          type: array
          items:
            $ref: '#/components/schemas/PolicyProducer'
        startIndex:
          type: integer
          minimum: 0
          description: Zero-based index of the first item returned.
        itemsCount:
          type: integer
          minimum: 0
          description: Number of items in the current response.
        totalItemsCount:
          type: integer
          minimum: 0
          description: Total number of items available.
    PolicyProducer:
      type: object
      properties:
        externalIds:
          description: External identifier
          $ref: '#/components/schemas/ProducerExternalIds'
        commissionOption:
          description: Commission option on the contract
          type: string
          maxLength: 50
        commission:
          description: Defines commission-related details assigned to the producer, including identifiers and allocation percentages that determine how compensation is distributed for the policy
          $ref: '#/components/schemas/ProducerCommission'
        producerNumber:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9._-]{1,50}$
          description: Carrier-assigned producer identifier.
    ProducerExternalIds:
      type: object
      properties:
        npn:
          description: National Producer Number.
          type: string
          maxLength: 10
          pattern: ^[0-9]{1,10}$
        crdNumber:
          description: Central Registration Depository number.
          type: string
          pattern: ^[0-9]{1,12}$
        agencyId:
          description: Identifier for the agency associated with the producer.
          type: string
          pattern: ^[0-9]{1,18}$
        firmId:
          description: Identifier for the brokerâ€‘dealer or parent firm affiliated with the producer.
          type: string
          pattern: ^[0-9]{1,18}$
    ProducerCommission:
      type: object
      properties:
        commissionIdentifier:
          description: Identifier for the commission schedule or contract tied to the producer.
          type: string
          pattern: ^[A-Za-z0-9._-]{1,100}$
        commissionSplitPercent:
          description: Represents the percentage share of total commission allocated to the producer, used when multiple producers are associated with the policy.
          type: number
          minimum: 0
          maximum: 100
    PolicyDates:
      type: object
      description: Policy date fields for the contract.
      properties:
        policyStartDate:
          description: The Policy Start Date refers to the official date on which the policy becomes effective and coverage begins. This date is critical for determining premium payments, coverage eligibility, policy      anniversaries, and contractual obligations. 
          type: string
          format: date
        applicationDate:
          description: The Application Date, also referred to as the Policy Sign Date, is the date when the policyholder completes and signs the insurance or annuity application. This marks the official request for coverage but does not necessarily mean the policy is active yet.
          type: string
          format: date
        applicationReceivedDate:
          description: The Application Received Date refers to the date when Zinnia (or the designated insurance company/administrator) officially receives the completed insurance or annuity application.
          type: string
          format: date
        issueDate:
          description: The Policy Issue Date, also known as the Policy Launch Date, is the date when the insurance company officially issues the policy to the client. This occurs after the application is approved, the insured accepts the offer, and payment information is provided. It marks the formal activation of the policy and triggers policy delivery.
          type: string
          format: date
        policyDeliveryDate:
          description: The Policy Delivery Date refers to the date when the policyholder is officially notified that their policy is available, either through an online portal, email, SMS, or physical mail. This date is critical because it marks the start of the free look period, allowing the policyholder to review the contract and cancel if needed.
          type: string
          format: date
        previousPolicyAnniversaryDate:
          description: The Previous Policy Anniversary Date refers to the most recent past annual recurrence of the Policy Start Date. This date is used for tracking past premium payments, benefit updates, policy renewals, and cash value calculations.
          type: string
          format: date
        previousPolicyMonthiversaryDate:
          description: The Previous Policy Monthiversary Date refers to the most recent past monthly recurrence of the Policy Start Date. It is used for tracking monthly premium payments, cost of insurance (COI) deductions, cash value updates, and policy charges.
          type: string
          format: date
        nextAnniversaryDate:
          description: The Next Policy Anniversary Date refers to the upcoming annual recurrence of the policyâ€™s start date. It is based on the Policy Start Date and marks key policy milestones such as premium due dates, cash value updates, policy renewals, and benefit adjustments.
          type: string
          format: date
        maturityDate:
          description: The Policy Maturity Date refers to the date when a life insurance policy reaches its maturity or an annuity contract reaches its maximum annuitization age. It is based on the Policy Start Date and determines when benefits become payable or coverage ends. 
          type: string
          format: date
        policyTerminationDate:
          description: The Policy Termination Date is the date when a life insurance or annuity policy officially ends, meaning coverage ceases, and no further benefits or obligations exist under the contract. The reason for termination may vary, including policy lapse, surrender, maturity, or claim payout.
          type: string
          format: date
        initialPaymentExpiryDate:
          description: The Initial Payment Amount Expiration Date refers to the deadline by which the initial premium payment must be made to keep the policy offer valid and ensure the policy goes into effect., if not received Policy will be Canceled due to no Premium Set at Issuance.
          type: string
          format: date
        nextMonthiversaryDate:
          description: The Next Policy Monthiversary Date refers to the same day of each month that corresponds to the Policy Start Date, marking the monthly recurrence of the policy. It is used for monthly premium payments, cost deductions, cash value calculations, and interest crediting.
          type: string
          format: date
      required:
      - policyStartDate
      - issueDate
    SystematicProgramsList:
      type: object
      properties:
        systematicPrograms:
          description: Systematic Programs
          type: array
          items:
            $ref: '#/components/schemas/SystematicProgram'
        startIndex:
          description: Zero-based index of the first record to return.
          type: integer
          minimum: 0
        itemsCount:
          description: Number of records included in the current response page.
          type: integer
          minimum: 0
        totalItemsCount:
          description: Total number of records available that match the request criteria, independent of pagination.
          type: integer
          minimum: 0
    SystematicProgram:
      type: object
      required:
      - arrangementType
      - allocationOptionType
      - frequency
      - startDate
      - endDate
      - nextProgramDate
      - amountType
      - externalArrangementId
      - paymentForm
      - numOfModalOccurrences
      - sourceTransferAmtType
      - destTransferAmtType
      - arrSource
      - arrSubType
      properties:
        arrangementType:
          description: Identifies the high-level type of systematic program set up on the policy, such as payment, withdrawal, loan repayment, RMD, or payout.
          type: string
          enum:
          - PAYMENT
          - WITHDRAWAL
          - LOANREPAYMENT
          - REQUIREDMINIMUMDISTRIBUTION
          - PAYOUT
        allocationOptionType:
          description: Specifies the method used to allocate the withdrawal amount within the policy.
          type: string
          enum:
          - PRORATA
          - DOLLAR
          - SPECIFYPERCENTAGE
          - SPECIFIEDFUNDS
          - SPECIFIEDSEGMENTS
          - DEFAULT
          - PECKINGORDER
          - EARNINGSONLY
        paymentForm:
          description: Party-level payment form. `EXCHANGE` is retained only for party-level exchange servicing scenarios; recurring disbursement schemas intentionally use the narrower ACH/EFT/CHECK/WIRE/DTCC vocabularies. Recurring systematic-program payment form. `EFT` is valid here; `EXCHANGE` is intentionally excluded because exchange handling is party-specific rather than a recurring disbursement mode.
          type: string
          enum:
          - DTCC
          - EFT
          - ACH
          - CHECK
          - WIRE
        frequency:
          description: Indicates how often the systematic program is scheduled to run, such as daily, every two weeks, monthly, semiannual, quarterly, annual, or single payment.
          type: string
          enum:
          - DAILY
          - EVERYTWOWEEKS
          - MONTHLY
          - SEMIANNUAL
          - QUARTERLY
          - ANNUAL
          - SINGLEPAYMENT
        startDate:
          description: The date when the systematic program begins executing payments or transfers (entered by user).
          type: string
          format: date
        endDate:
          type: string
          format: date
        previousProgramDate:
          description: The last date on which a systematic transaction was processed
          type: string
          format: date
        optedNextProgramDate:
          description: A user-selected or modified next payment date, different from the scheduled one
          type: string
          format: date
        nextProgramDate:
          description: The date on which the next payment is scheduled
          type: string
          format: date
        amountType:
          description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
          type: string
          enum:
          - AMOUNT
          - PERCENTAGE
          - MAX
          - FREEWITHDRAWALAMOUNT
          - WITHDRAWALUNTILBASIS
          - EARNINGSONLY
          - MODIFIEDEARNINGSONLY
        requestedAmount:
          type: number
          minimum: 0
          maximum: 9999999999.99
          description: Required when amountType is 'AMOUNT'. Mutually exclusive with
            requestedPercentage. Omit this field when amountType is not AMOUNT instead
            of sending null.
        requestedPercentage:
          type: number
          description: Required when amountType is 'PERCENTAGE'. Mutually exclusive
            with requestedAmount. Populate for PERCENTAGE requests; otherwise omit
            the field.
          minimum: 0
          maximum: 100
        externalArrangementId:
          description: Identifier used to uniquely recognize an existing systematic program (e.g., SWP) associated with a contract. This ID enables the system to determine whether a systematic arrangement already exists and supports subsequent updates, modifications, or termination of that arrangement.
          type: string
          maxLength: 100
        numOfModalOccurrences:
          description: Amount value used the mode.
          type: integer
          minimum: 0
          maximum: 9999999999
        modalAmt:
          type: number
          minimum: 0
          maximum: 9999999999.99
          description: Legacy DD abbreviation retained; represents modal amount.
        modalPct:
          type: number
          minimum: 0
          maximum: 100
          description: Legacy DD abbreviation retained; represents modal percentage.
        sourceTransferAmtType:
          description: Source transfer type.
          type: string
          enum:
          - AMOUNT
          - PERCENTAGE
          - PRO_RATA
          - SPECIFIED_FUNDS
          - ALL_FUNDS
          - OTHER
        destTransferAmtType:
          description: Destination transfer type.
          type: string
          enum:
          - AMOUNT
          - PERCENTAGE
          - PRO_RATA
          - SPECIFIED_FUNDS
          - ALL_FUNDS
          - OTHER
        arrSource:
          type: string
          enum:
          - TransferAmt
          - TransferPct
          description: Legacy DD abbreviation retained; represents arrangement source.
            Arrangement source retained per DD naming.
        taxWithholdingInstructions:
          description: List of tax withholding instruction entries.
          type: array
          items:
            $ref: '#/components/schemas/TaxWithholdingInstruction'
        arrSubType:
          type: string
          pattern: ^[A-Za-z0-9_ -]{1,100}$
          maxLength: 100
          description: Legacy DD abbreviation retained; represents arrangement subtype.
            Arrangement subtype retained per DD naming.
        dayOfMonth:
          type: string
          pattern: ^(?:[1-9]|[12][0-9]|3[01])$
          description: Day of month for the scheduled arrangement.
        productCode:
          description: Unique fund/sub-account code for the product (carrier’s fund code).
          type: string
          pattern: ^[A-Za-z0-9._-]{1,50}$
        parties:
          description: Represents all individuals or entities associated with the policy, including their identity, relationship to the contract, and role in policy servicing or benefit distribution.
          type: array
          items:
            type: object
            required:
            - partyRole
            - taxId
            - paymentForm
            - percentage
            - bankId
            properties:
              partyRole:
                type: string
                enum:
                - Payor
                - Payee
                description: Role of the party within the systematic program. Uses
                  PascalCase values to align with the PartyRole filter vocabulary.
              taxId:
                description: Tax Identification Number for the party (individual or entity).
                type: string
                maxLength: 9
                pattern: ^[0-9]{9}$
                minLength: 9
              percentage:
                description: Percentage rate to withhold. Mutually exclusive with dollar; provide one, not both.
                type: number
                minimum: 0
                maximum: 100
              bankId:
                description: Bank identifier.
                type: string
                maxLength: 100
              addressId:
                description: Address identifier.
                type: string
                maxLength: 100
              paymentForm:
                description: Party-level payment form. `EXCHANGE` is retained only for party-level exchange servicing scenarios; recurring disbursement schemas intentionally use the narrower ACH/EFT/CHECK/WIRE/DTCC vocabularies.
                type: string
                enum:
                - DTCC
                - ACH
                - CHECK
                - WIRE
                - EXCHANGE
      allOf:
      - if:
          properties:
            amountType:
              description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
              const: AMOUNT
          required:
          - amountType
        then:
          required:
          - requestedAmount
          not:
            required:
            - requestedPercentage
      - if:
          properties:
            amountType:
              description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
              const: PERCENTAGE
          required:
          - amountType
        then:
          required:
          - requestedPercentage
          not:
            required:
            - requestedAmount
      - if:
          properties:
            amountType:
              description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
              enum:
              - MAX
              - FREEWITHDRAWALAMOUNT
              - WITHDRAWALUNTILBASIS
              - EARNINGSONLY
          required:
          - amountType
        then:
          required:
          - amountType
          not:
            anyOf:
            - required:
              - requestedAmount
            - required:
              - requestedPercentage
    Rider:
      type: object
      required:
      - timestamp
      - effectiveDate
      - status
      - coverageId
      properties:
        timestamp:
          description: Create or Update timestamp of transaction event
          type: string
          format: date-time
        riderType:
          description: Indicates whether the record represents the base contract or a specific rider/benefit feature attached to the policy. This value is used to categorize riders for servicing and display purposes and is independent of transaction events or statuses.
          type: string
          enum:
          - BASE
          - RIDER
          - INTEGRATED_RIDER
          - BENEFIT_RIDER
          - INCOME_RIDER
          - DEATH_BENEFIT_RIDER
          - LTC_RIDER
          - GMWB_RIDER
          - GMDB_RIDER
          - GMAB_RIDER
          - CHARGE_RIDER
          - DISCOUNT
          - BASE_INCREASE
          - RIDER_INCREASE
          - OTHER
          - UNKNOWN
        riderName:
          description: The specific name of the rider as designated by the insurance company. For example - Terminal Illness Accelerated Death Benefit
          type: string
          maxLength: 200
        isRiderElected:
          description: Indicates the election status of the rider on the policy, specifying whether the policyholder has formally elected to include the rider
          type: boolean
        riderCode:
          description: A unique identifier or alphanumeric code assigned to the rider
          type: string
          pattern: ^[A-Za-z0-9._-]{1,50}$
        underwritingStatus:
          description: Indicates underwriting decision status associated with the policy or rider.
          type: string
          enum:
          - APPROVED
          - DECLINED
        effectiveDate:
          description: Represents the date on which the policy or contract became active and coverage officially began.
          type: string
          format: date
        exerciseDate:
          description: The date the policyholder elects to use or activate the rider benefit
          type: string
          format: date
        terminationDate:
          description: The date on which the rider coverage ends/ is terminated
          type: string
          format: date
        status:
          description: A Feature Status in life insurance and annuities indicates the current state or activation condition of a specific feature within a policy or contract. It reflects whether a feature is active, inactive, pending, or restricted, helping insurers, agents, and policyholders track policy functionality
          type: string
          enum:
          - ACTIVE
          - TERMINATED
          - PENDING
          - SUSPENDED
        coverageId:
          description: The Coverage ID is a unique identifier assigned to a specific coverage type or benefit within an insurance policy. It helps insurance companies, agents, and policyholders track and differentiate multiple coverage components within a single policy 
          type: string
          pattern: ^[A-Za-z0-9._-]{1,100}$
        amount: 
          description: The total benefit amount the rider provides (separate from the base policy’s coverage.)
          type: number
          minimum: 0
          maximum: 9999999999.99
        annualBenefitAmount:
          description: The maximum benefit amount of the benefit base, policyholder can withdraw each year
          type: number
          minimum: 0
          maximum: 9999999999.99
        riderBenefitAmount:
          description: The Total Benefit Amount represents the maximum guaranteed amount available under the annuity rider over the life of the contract/rider
          type: number
          minimum: 0
          maximum: 9999999999.99
        riderBenefitPercent:
          description: The fixed percentage applied to the Rider Benefit Amount to calculate the annual guaranteed benefit amount
          type: number
          multipleOf: 0.01
          minimum: 0
          maximum: 100
        riderParticipants:
          description: The parties participating in the rider.
          type: array
          items:
            type: object
            required:
            - taxId
            properties:
              insuredAgeAtIssue:
                description: The age of the insured at the time the rider was issued.
                type: integer
                format: int32
                minimum: 0
                maximum: 150
              taxId:
                description: Tax Identification Number for the party (individual or entity).
                type: string
                maxLength: 9
                pattern: ^[0-9]{9}$
                minLength: 9
        charge:
          description: List of charges/deductions.
          type: object
          properties:
            riderExerciseCharge:
              description: One Time Rider Charge that will be Applied upon Rider Activation.
              type: number
              multipleOf: 0.01
              minimum: 0
              maximum: 9999999999.99
            riderExerciseChargeRate:
              description: The rate or percentage applied to calculate the charge for exercising the rider.
              type: number
              multipleOf: 0.01
              minimum: 0
              maximum: 100
        maximumChronicIllnessBenefitPercentage:
          description: The highest percentage of the death benefit or face amount that can be taken for chronic illness coverage
          type: number
          minimum: 0
        maximumPeriodicPaymentPeriod:
          description: The maximum duration over which payments can be made under the rider ( in Months)
          type: integer
          minimum: 0
        riderPaymentDate:
          description: The date the benefit payout under the rider is to be disbursed to the policyholder or beneficiary
          type: string
          format: date
        remainingBenefit:
          description: The remaining benefit amount for the rider. Incremented by Premiums and adjusted by withdrawals.
          type: number
          minimum: 0
          maximum: 9999999999.99
        isAdditionalBenefitUsedUp:
          description: Indicates whether the ADL benefit is utilised on the contract.
          type: boolean
        totalBenefit:
          description: The total guaranteed value the contract owner is entitled to at the end of the GMAB holding period — assuming no disqualifying withdrawals or events.
          type: number
          minimum: 0
          maximum: 9999999999.99
        payoutOption:
          description: Single or Joint Payout (not driven by Owners on the policy, even a jointly owned policy can have single as an option. Used in configuration to set different GMWB benefits for Single and Joint GMWB Amount Types
          type: string
          enum:
          - SINGLE
          - JOINT
        benefitPercent:
          description: Ties to Withdrawal Reset Benefit % Annual Limit on Calender Processing if GMWB Anniversary Base reset is elected. Equals result of GMWB Benefit % equation box in Withdrawal tab (GMWB) Ku - Payout Factor  Percentage of the benefit base that will be available for withdrawal each year
          type: number
          minimum: 0
          maximum: 100
        annualBenefitLimit:
          description: GMWB Annual Limit, The total amount that can be withdrawn as a benefit of this rider in any given policy year, regardless of whether or not there is sufficient account value. It is also the annual limit on amounts that can be withdrawn without adversely affecting future annual and lifetime benefits from the rider.this amount will be impacted during Reset or Withdrawals or Premium events
          type: number
          minimum: 0
          maximum: 9999999999.99
        riderSubType:
          type: string
          pattern: ^[A-Za-z0-9_ -]{1,100}$
          maxLength: 100
          description: Subtype classification for the rider.
        livesType:
          description: For living benefit riders identifies if single or joint life rider
          type: string
          enum:
          - SINGLE
          - JOINT
          - MULTIPLE
          - UNKNOWN
        isParticipantIrrevocable:
          description: Irrevocable Ind
          type: boolean
        additionalRiderClassification:
          type: string
          pattern: ^[A-Za-z0-9_ -]{1,100}$
          maxLength: 100
          description: Additional rider classification code. Additional rider classification
            retained per DD naming.
        riderFreeAmt:
          type: number
          minimum: 0
          maximum: 9999999999.99
          description: Legacy DD abbreviation retained; represents rider free amount.
        participantRoleCode:
          type: string
          pattern: ^[A-Za-z0-9_ -]{1,100}$
          maxLength: 100
          description: Role code describing the rider participant.
    RidersList:
      type: object
      properties:
        startIndex:
          description: Zero-based index of the first record to return.
          type: integer
          minimum: 0
        itemsCount:
          description: Number of records included in the current response page.
          type: integer
          minimum: 0
        totalItemsCount:
          description: Total number of records available that match the request criteria, independent of pagination.
          type: integer
          minimum: 0
        riders:
          description: Represents the set of rider benefits or additional features attached to the base policy, including their status, coverage details, and associated benefit values.
          type: array
          items:
            $ref: '#/components/schemas/Rider'
    PayoutsList:
      type: object
      properties:
        startIndex:
          description: Zero-based index of the first record to return.
          type: integer
          minimum: 0
        itemsCount:
          description: Number of records included in the current response page.
          type: integer
          minimum: 0
        totalItemsCount:
          description: Total number of records available that match the request criteria, independent of pagination.
          type: integer
          minimum: 0
        incomeArrangements:
          description: List of income arrangements (annuitization + payout) for the policy; empty if none.
          type: array
          items:
            type: object
            required:
            - annuitization
            - incomePayment
            properties:
              incomeArrangementId:
                description: Unique identifier for the arrangement if carrier provides one; else omit.
                type: string
                pattern: ^[A-Za-z0-9._-]{1,100}$
              annuitization:
                description: Annuitization terms describing how the policy entered income phase.
                type: object
                required:
                - isAnnuitized
                properties:
                  isAnnuitized:
                    description: True when the policy is in annuitized/income phase for this arrangement.
                    type: boolean
                  annuitizationStartDateTime:
                    description: Date-time annuitization/income started (DTCC date-time string).
                    type: string
                    format: date-time
                  annuitizationEndDateTime:
                    description: Date-time income ended (DTCC date-time string), if applicable.
                    type: string
                    format: date-time
                  annuitizationTypeCode:
                    description: DTCC payout/annuitization type code.
                    type: string
                    enum:
                    - FIXED
                    - VARIABLE
                  periodCertain:
                    description: Period certain configuration for the annuitization option.
                    type: object
                    properties:
                      numberOfPayments:
                        type: string
                        pattern: ^\d+$
                        description: Total payment count. String type retained for
                          carrier-specific leading-zero semantics.
                  survivorReduction:
                    description: Survivor reduction terms if joint/survivor option.
                    type: object
                    properties:
                      primaryreductionCode:
                        description: DTCC primary survivor reduction code.
                        type: string
                        pattern: ^[A-Za-z0-9._-]{1,50}$
                      jointreductionCode:
                        description: DTCC joint survivor reduction code.
                        type: string
                        pattern: ^[A-Za-z0-9._-]{1,50}$
              incomePayment:
                description: One or more income payment streams tied to the annuitization arrangement (usually 1).
                type: object
                properties:
                  incomePaymentId:
                    description: Unique id for the income payment stream if carrier provides one; otherwise omit.
                    type: string
                    pattern: ^[A-Za-z0-9._-]{1,100}$
                  status:
                    description: A Feature Status in life insurance and annuities indicates the current state or activation condition of a specific feature within a policy or contract. It reflects whether a feature is active, inactive, pending, or restricted, helping insurers, agents, and policyholders track policy functionality
                    type: string
                    enum:
                    - ACTIVE
                    - INACTIVE
                    - PENDING
                    - ENDED
                  frequencyCode:
                    type: string
                    pattern: ^[A-Za-z0-9._-]{1,50}$
                    description: Frequency code value. String type retained for carrier-specific
                      code semantics.
                  amount:
                    description: The total benefit amount the rider provides (separate from the base policy’s coverage.)
                    type: object
                    properties:
                      value:
                        description: Income payment amount (raw DTCC decimal string).
                        type: string
                        pattern: ^-?\d+(\.\d+)?$
                      amountType:
                        description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
                        type: string
                        enum:
                        - GROSS
                        - NET
                      amountCode:
                        description: DTCC amount qualifier code (maps from insurancePolicyPayoutAmountCode).
                        type: string
                        pattern: ^[A-Za-z0-9._-]{1,50}$
                  adjustments:
                    description: Adjustment parameters that affect the income payment stream over time.
                    type: object
                    properties:
                      increasePercentage:
                        description: DTCC increase percent applied to payments (raw decimal string).
                        type: number
                        minimum: 0
                        maximum: 100
                  taxExclusion:
                    description: Tax exclusion info for income payments.
                    type: object
                    properties:
                      value:
                        description: Income payment amount (raw DTCC decimal string).
                        type: string
                        pattern: ^-?\d+(\.\d+)?$
    TransactionsList:
      type: object
      properties:
        startIndex:
          description: Zero-based index of the first record to return.
          type: integer
          minimum: 0
        itemsCount: 
          description: Number of records included in the current response page.
          type: integer
          minimum: 0
        totalItemsCount:
          description: Total number of records available that match the request criteria, independent of pagination.
          type: integer
          minimum: 0
        transactions:
          description: Transactions that may be performed by the authorized entities.
          type: array
          items:
            type: object
            required:
            - transactionId
            - planCode
            - requestDate
            - effectiveDate
            - processDate
            - status
            - transactionReason
            - timestamp
            - version
            properties:
              transactionId:
                type: string
                pattern: ^[A-Za-z0-9._-]{1,100}$
              originalTransactionId:
                type: string
                pattern: ^[A-Za-z0-9._-]{1,100}$
              partyPolicyChangeReferenceId:
                type: string
                pattern: ^[A-Za-z0-9._-]{1,100}$
              partyPolicyNewReferenceId:
                type: string
                pattern: ^[A-Za-z0-9._-]{1,100}$
              planCode:
                description: The Plan Code is a carrier-assigned unique identifier used to distinguish a specific product, rate structure, and version of a life insurance or annuity policy. It ensures accurate policy tracking, pricing, and administration
                type: string
                pattern: ^[A-Za-z0-9._-]{1,50}$
              parentId:
                type: string
                pattern: ^[A-Za-z0-9._-]{1,100}$
              transactionType:
                type: string
                enum:
                - SubsequentPayment
                - OneTimePremium
                - PartialWithdrawalOneTime
                - SystematicPartialWithdrawal
                - RequiredMinimumDistributionOneTime
                - SystematicRequiredMinimumDistribution
                - FullSurrender
                - FundTransfer
                - FundAllocationsChange
                - Sweep
                - DollarCostAverage
                - NewLoan
                - LoanRepaymentOneTime
                - SystematicLoanRepayment
                - Annuitization
                - SystematicAnnuityPayout
                - PayoutAmountChange
                - ServiceCharge
                - RiderCharge
                - ValueAdjustment
                - InterestCredit
                - AddressChange
                - EmailChange
                - PhoneNumberChange
                - BeneficiaryChange
                - OwnerChange
                - BankAccountChange
                - CommunicationPreferenceChange
                - Reinstatement
                - Lapse
                - Other
              requestDate:
                type: string
                format: date
              effectiveDate:
                description: Represents the date on which the policy or contract became active and coverage officially began.
                type: string
                format: date
              processDate:
                type: string
                format: date
              reversalDate:
                type: string
                format: date
              status:
                description: A Feature Status in life insurance and annuities indicates the current state or activation condition of a specific feature within a policy or contract. It reflects whether a feature is active, inactive, pending, or restricted, helping insurers, agents, and policyholders track policy functionality
                type: string
                enum:
                - Pending
                - Completed
                - Failed
                - Reversed
                - Canceled
                - PendingReversal
              transactionReason:
                type: string
                enum:
                - ONETIMEPREMIUM
                - GRACEPERIODPREMIUM
                - REINSTATEMENTPREMIUM
                - EXCHANGE1035
                - SURRENDER
                - AMOUNTEXCESSTOMEC
                - AMOUNTEXCESSTOGUIDELINE
                - CURRENTVALUE
                - COSTBASIS
                - GUIDELINESINGLEPREMIUM
                - GUIDELINELEVELPREMIUM
                - SEVENPAYPREMIUM
                - TOTALYTDPREMIUMAMOUNT
                - FACEDECREASECOVERAGE
                - INITIALPREMIUMEXPIRATION
                - COMPLIANCE
                - STARTINGPRICE
                - LUMPSUM
                - FIVEYEARDEFERRAL
                - SPOUSALCONTINUATION
                - DISCOUNT
                - CONTROLBUSINESSINDICATOR
                - NATIONALCHANGEOFADDRESS
              transactionAmounts:
                $ref: '#/components/schemas/TransactionAmounts'
              charges:
                description: List of charges/deductions.
                type: array
                items:
                  type: object
                  properties:
                    chargeType:
                      description: Identifies the type of charge applied to the transaction. Charges may include service fees, rider charges, administrative fees, surrender charges, market value adjustments (MVA), taxes, or other carrier-defined charges associated with the transaction.
                      type: string
                      enum:
                      - SERVICE_CHARGE
                      - RIDER_CHARGE
                      - ADMINISTRATIVE_CHARGE
                      - SURRENDER_CHARGE
                      - MVA
                      - TAX
                      - COST_OF_INSURANCE
                      - EXPENSE_CHARGE
                      - UNIT_EXPENSE_CHARGE
                      - WITHDRAWAL_CHARGE
                      - OTHER
                    isChargeWaived:
                      type: boolean
                    chargeWaiverReason:
                      type: string
                    chargeAmount:
                      description: The amount of the charge applied for this transaction.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
                    chargeAppliedRate:
                      description: The rate (%) utilized for calculation of charge.
                      type: number
                      minimum: 0
                      maximum: 9999999999.99
              taxWithholdingInstructions:
                description: List of tax withholding instruction entries.
                type: array
                items:
                  $ref: '#/components/schemas/TaxWithholdingInstruction'
              timestamp:
                description: Create or Update timestamp of transaction event
                type: string
                format: date-time
              isReverseInitiated:
                type: boolean
              version:
                type: integer
                format: int32
              externalIdentifiers:
                type: object
                properties:
                  referenceNumber:
                    type: string
                    pattern: ^[A-Za-z0-9._-]{1,100}$
                  externalTransactionId:
                    type: string
                    pattern: ^[A-Za-z0-9._-]{1,100}$
                  externalArrangementId:
                    description: Identifier used to uniquely recognize an existing systematic program (e.g., SWP) associated with a contract. This ID enables the system to determine whether a systematic arrangement already exists and supports subsequent updates, modifications, or termination of that arrangement.
                    type: string
                    pattern: ^[A-Za-z0-9._-]{1,100}$
    TransactionAmounts:
      type: object
      description: Details of financial amounts associated with the transaction
      properties:
        requestedAmount:
          type: number
          description: 'Required when `amountType` is AMOUNT. Must not be provided
            for PERCENTAGE, MAX, FREEWITHDRAWALAMOUNT, WITHDRAWALUNTILBASIS, or EARNINGSONLY.

            '
          minimum: 0
          maximum: 9999999999.99
        requestedPercentage:
          type: number
          description: 'Required when `amountType` is PERCENTAGE. Must not be provided
            for AMOUNT, MAX, FREEWITHDRAWALAMOUNT, WITHDRAWALUNTILBASIS, or EARNINGSONLY.

            '
          minimum: 0
          maximum: 100
        amountType:
          description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
          type: string
          enum:
          - AMOUNT
          - PERCENTAGE
          - MAX
          - FREEWITHDRAWALAMOUNT
          - WITHDRAWALUNTILBASIS
          - EARNINGSONLY
        disbursementType:
          type: string
          enum:
          - GROSS
          - NET
        disbursementPaymentForm:
          type: string
          enum:
          - DTCC
          - EFT
          - ACH
          - CHECK
          - WIRE
          description: Transaction disbursement payment form. Uses the recurring disbursement
            vocabulary with `EFT`; `EXCHANGE` is intentionally excluded because it
            applies only to party-level exchange servicing.
      required:
      - amountType
      - disbursementType
      allOf:
      - if:
          properties:
            amountType:
              description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
              const: AMOUNT
          required:
          - amountType
        then:
          required:
          - requestedAmount
          not:
            required:
            - requestedPercentage
      - if:
          properties:
            amountType:
              description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
              const: PERCENTAGE
          required:
          - amountType
        then:
          required:
          - requestedPercentage
          not:
            required:
            - requestedAmount
      - if:
          properties:
            amountType:
              description: Indicates how the scheduled amount is defined for the systematic program, such as a fixed amount, percentage, maximum available amount, free withdrawal amount, withdrawal until basis, earnings only, pro rata amount, or modified earnings only.
              enum:
              - MAX
              - FREEWITHDRAWALAMOUNT
              - WITHDRAWALUNTILBASIS
              - EARNINGSONLY
          required:
          - amountType
        then:
          required:
          - amountType
          not:
            anyOf:
            - required:
              - requestedAmount
            - required:
              - requestedPercentage
    UnderlyingAssets:
      type: object
      properties:
        startIndex:
          description: Zero-based index of the first record to return.
          type: integer
          minimum: 0
        itemsCount:
          description: Number of records included in the current response page.
          type: integer
          minimum: 0
        totalItemsCount:
          description: Total number of records available that match the request criteria, independent of pagination.
          type: integer
          minimum: 0
        underlyingAssets:
          type: array
          items:
            type: object
            required:
            - insuranceActivityFundID
            properties:
              insuranceActivityFundID:
                type: string
                pattern: ^[A-Za-z0-9._-]{1,50}$
              insuranceActivityFundAmount:
