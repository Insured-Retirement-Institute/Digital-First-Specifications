                pattern: ^-?\d+(\.\d+)?$
              insuranceActivityFundAmountDebitCreditIndicator:
                type: string
                enum:
                - DEBIT
                - CREDIT
              insuranceActivityFundUnitAmount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
              insuranceActivityFundUnitAmountDebitCreditIndicator:
                type: string
                enum:
                - DEBIT
                - CREDIT
              insuranceActivityFundUnitPriceAmount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
              insuranceProductSubAccountProductFullName:
                type: string
                maxLength: 200
              insuranceProductSubAccountAssetClassCode:
                type: string
                enum:
                - FIXED
                - VARIABLE
                - INDEXED
                - MODEL
                - CASH
                - EQUITY
                - OTHER
                description: Asset class classification code.
              insuranceActivityMutualFundCusipNumber:
                type: string
                pattern: ^[0-9]{3}[A-Z0-9]{5}[0-9]$
                minLength: 9
                maxLength: 9
                description: Uses the standard CUSIP format.
              insuranceActivityFundMVAAmount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
              insuranceActivityFundMVAAmountDebitCreditIndicator:
                type: string
                enum:
                - DEBIT
                - CREDIT
              insuranceActivityFundAdministrativeChargeAmount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
              insuranceActivityFundAdministrativeChargeAmountDebitCreditIndicator:
                type: string
                enum:
                - DEBIT
                - CREDIT
              insuranceActivityFundSurrenderChargeAmount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
              insuranceActivityFundSurrenderChargeAmountDebitCreditIndicator:
                type: string
                enum:
                - DEBIT
                - CREDIT
              insuranceActivityFundEmployerAmount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
              insuranceActivityFundEmployerAmountDebitCreditIndicator:
                type: string
                enum:
                - DEBIT
                - CREDIT
              insuranceActivityFundEmployeeAmount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
              insuranceActivityFundEmployeeAmountDebitCreditIndicator:
                type: string
                enum:
                - DEBIT
                - CREDIT
    TaxWithholdingInstruction:
      type: object
      description: Tax withholding instructions. Exactly one of dollar or percentage
        may be provided when taxRateToUse expects entered values. filingStatus remains
        optional per the data dictionary.
      properties:
        party:
          description: Impacted party details for withholding.
          anyOf:
          - $ref: '#/components/schemas/IndividualIdentity'
          - $ref: '#/components/schemas/EntityIdentity'
        taxWithholdingType:
          description: Type of tax withholding.
          type: string
          enum:
          - FEDERAL
          - STATE
          - NRA
          - BACKUP
        taxRateToUse:
          description: Selected tax rate source.
          type: string
          enum:
          - NOWITHHOLDINGELECTED
          - USEVALUESENTERED
          - NOWITHHOLDINGALLOWED
          - USEDEFAULTTABLE
        filingStatus:
          type: string
          enum:
          - SINGLE
          - DOMESTICPARTNERSHIP
          - DEFAULT
          - MARRIED
          - HEADOFHOUSEHOLD
          - WIDOWED
          - DIVORCED
          description: Optional per data dictionary. Typically provided when `taxRateToUse`
            is `USEDEFAULTTABLE` and filing status is needed to determine the applicable
            withholding table; do not treat this field as universally required.
        dollar:
          type: number
          description: Fixed dollar amount to withhold. Mutually exclusive with percentage;
            provide one, not both.
          minimum: 0
          maximum: 9999999999.99
        percentage:
          description: Percentage rate to withhold. Mutually exclusive with dollar; provide one, not both.
          type: number
          minimum: 0
          maximum: 100
        exemptions:
          description: Requested exemptions value
          type: integer
          minimum: 0
          maximum: 99
        taxJurisdiction:
          description: Jurisdiction for tax purposes.If taxwithholdingType=STATE this field should be mandatory.
          type: string
          maxLength: 50
      required:
      - taxRateToUse
      - taxWithholdingType
      oneOf:
      - required:
        - dollar
      - required:
        - percentage
      allOf:
      - if:
          properties:
            taxWithholdingType:
              description: Type of tax withholding.
              const: STATE
          required:
          - taxWithholdingType
        then:
          required:
          - taxJurisdiction
    IndividualParty:
      description: Schema for individual party data
      type: object
      allOf:
      - $ref: '#/components/schemas/IndividualIdentity'
      - $ref: '#/components/schemas/PartyRelationship'
    EntityParty:
      description: Schema for entity party data
      type: object
      allOf:
      - $ref: '#/components/schemas/EntityIdentity'
      - $ref: '#/components/schemas/PartyRelationship'
    IndividualIdentity:
      description: Schema for individual identity data
      required:
      - firstName
      - lastName
      - taxId
      - type
      type: object
      properties:
        type:
          description: Identity type
          type: string
          const: individual
        firstName:
          description: First name of the party.
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9=()*@#\s.,'_/~%$!();:&"®`\\?\-]{1,100}$
        middleName:
          description: Middle name of the party.
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9=()*@#\s.,'_/~%$!();:&"®`\\?\-]{1,100}$
        lastName:
          description: Last name of the party.
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9=()*@#\s.,'_/~%$!();:&"®`\\?\-]{1,100}$
        taxId:
          description: Tax Identification Number for the party (individual or entity).
          type: string
          maxLength: 9
          pattern: ^[0-9]{9}$
          minLength: 9
    PartyRelationship:
      description: Schema for party relationship data
      type: object
      required:
      - relationships
      properties:
        relationships:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum:
            - owner
            - jointOwner
            - annuitant
            - jointAnnuitant
            - primaryBeneficiary
            - contingentBeneficiary
          description: Canonical response-body relationship vocabulary. Uses camelCase
            relationship values returned by the service and is intentionally narrower
            than the PartyRole query filter vocabulary. A single party may hold multiple
            concurrent relationships, so maxItems is aligned to the full response
            vocabulary.
    EntityIdentity:
      description: Schema for entity identity data
      type: object
      required:
      - type
      - name
      - taxId
      properties:
        type:
          description: Identity type
          type: string
          const: entity
        name:
          description: Entity name of the party.
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[\w=()*@#\s.,'\/~%$!;:&"Â®`\\?\-]{1,100}$
        taxId:
          description: Tax Identification Number for the party (individual or entity).
          type: string
          maxLength: 9
          pattern: ^[0-9]{9}$
          minLength: 9
    Bank:
      description: Financial institution details.
      type: object
      required:
      - nameOnAccount
      - accountType
      - accountNumber
      - routingNumber
      properties:
        bankId:
          description: Bank identifier.
          type: string
          maxLength: 100
        nameOnAccount:
          description: Name on the bank account.
          type: string
          maxLength: 100
        accountStatus:
          description: Status of the bank account.
          type: string
          enum:
          - ACTIVEBANKACCOUNT
          - TERMINATEDBANKACCOUNT
        accountType:
          description: Type of the bank account.
          type: string
          enum:
          - CHECKING
          - SAVINGS
          - CREDITCARDACCOUNT
          - DEBITCARDACCOUNT
          - BROKERAGEACCOUNT
          - CERTIFICATEOFDEPOSITACCOUNT
        accountNumber:
          description: Bank account number.
          type: string
          pattern: ^\d{4,17}$
          maxLength: 17
        routingNumber:
          description: Routing number.
          type: string
          pattern: ^\d{9}$
        branchName:
          description: Branch name.
          type: string
          maxLength: 100
    Address:
      description: Physical or mailing address details.
      type: object
      required:
      - addressType
      - addressLine1
      - city
      - state
      - zipCode
      properties:
        addressId:
          description: Address identifier.
          type: string
          maxLength: 100
        addressType:
          description: Type of address.
          type: string
          enum:
          - RESIDENCE
          - BUSINESS
          - POBOXSEASONAL
          - OTHER
        addressLine1:
          description: First line of the address.
          type: string
          maxLength: 100
        addressLine2:
          description: Second line of the address.
          type: string
          maxLength: 100
        addressLine3:
          description: Third line of the address.
          type: string
          maxLength: 100
        addressLine4:
          description: Fourth line of the address.
          type: string
          maxLength: 100
        addressLine5:
          description: Fifth line of the address.
          type: string
          maxLength: 100
        city:
          description: City name.
          type: string
          maxLength: 100
        state:
          description: State code (2-digit ISO).
          type: string
          pattern: ^[A-Z]{2}$
        zipCode:
          description: Zip code.
          type: string
          pattern: ^[0-9A-Za-z -]{3,10}$
        zipCodeExtension:
          description: Zip code extension.
          type: string
          pattern: ^[0-9A-Za-z]{1,4}$
        country:
          description: Country code (2-digit ISO).
          type: string
          pattern: ^[A-Z]{2}$
    Phone:
      type: object
      required:
      - countryCode
      - areaCode
      - dialNumber
      properties:
        startDate:
          description: The date when the systematic program begins executing payments or transfers (entered by user).
          type: string
          format: date
        endDate:
          type: string
          format: date
        phoneType:
          description: Indicates the classification of the phone number provided.
          type: string
          enum:
          - MOBILE
          - HOME
          - BUSINESS
          - CLAIMCENTER
          - CUSTOMERSERVICE
          - CORPORATEOFFICE
          - FAX
          - UNKNOWN
          - OTHER
        countryCode:
          description: Country Code of the phone.
          type: string
          pattern: ^\+?[0-9]{1,3}$
        areaCode:
          type: string
          pattern: ^[0-9]{2,5}$
          description: Supports domestic and international numbering plans; 2 to 5
            digits are allowed.
        dialNumber:
          description: Dial number of the phone
          type: string
          pattern: ^[0-9]{4,12}$
        extension:
          description: Dial in Extension for phone
          type: string
          pattern: ^[A-Za-z0-9-]{1,10}$
        bestTime:
          description: The best time to contact the party via phone.
          type: string
          enum:
          - MORNING
          - AFTERNOON
          - EVENING
          - ANYTIME
        timezone:
          description: Timezone for the entered phone details.
          type: string
          pattern: ^[A-Za-z_]+/[A-Za-z_]+(?:/[A-Za-z_]+)?$
        isPreferred:
          description: The Preferred Email Indicator is a boolean flag or attribute assigned to each email associated with a party, used to identify which email number should be used as the primary email for communication.
          type: boolean
        phoneId:
          description: The record Id stored internally in zahara for each phone
          type: string
          pattern: ^[A-Za-z0-9._-]{1,100}$
    Email:
      type: object
      required:
      - emailAddress
      properties:
        startDate:
          description: The date when the systematic program begins executing payments or transfers (entered by user).
          type: string
          format: date
        endDate:
          type: string
          format: date
        emailType:
          description: Specifies the type or category of the email address.
          type: string
          enum:
          - PERSONAL
          - BUSINESS
          - CUSTOMERSERVICE
          - OTHER
        emailAddress:
          description: Email address of the party.
          type: string
          format: email
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
        isPreferred:
          description: The Preferred Email Indicator is a boolean flag or attribute assigned to each email associated with a party, used to identify which email number should be used as the primary email for communication.
          type: boolean
        emailId:
          description: The record Id stored internally in zahara for each email.
          type: string
          pattern: ^[A-Za-z0-9._-]{1,100}$
    Identification:
      type: object
      required:
      - startDate
      - endDate
      properties:
        identificationId:
          description: A unique system-generated ID for tracking individual identifier records.
          type: string
          pattern: ^[A-Za-z0-9._-]{1,100}$
        startDate:
          description: The date when the systematic program begins executing payments or transfers (entered by user).
