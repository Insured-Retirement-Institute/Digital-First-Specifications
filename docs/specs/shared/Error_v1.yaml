# Modified by Cursor: canonical README Standard Error Schema (shared component)
components:
  schemas:
    Error:
      type: object
      required:
        - httpStatus
        - code
        - timestamp
        - message
        - userMessage
        - correlationId
      properties:
        httpStatus:
          type: integer
          description: HTTP status code associated with this error (400–599).
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Structured error code in domain.category.subcategory format.
        timestamp:
          type: string
          format: date-time
          description: When the error occurred.
        message:
          type: string
          description: Developer-focused technical message.
        userMessage:
          type: string
          description: Safe end-user message suitable for display.
        correlationId:
          type: string
          description: Cross-system tracing identifier echoed from the request when supplied.
        validationErrors:
          type: array
          description: Field-level or rule-level validation failures.
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                description: Structured error code for this validation failure.
              message:
                type: string
                description: Description of the validation failure.
