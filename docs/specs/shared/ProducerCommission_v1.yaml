# Modified by Cursor: shared ProducerCommission schema (policy inquiry family)
components:
  schemas:
    ProducerCommission:
      type: object
      properties:
        commissionIdentifier:
          description: Identifier for the commission schedule or contract tied to the producer.
          type: string
          pattern: '^[A-Za-z0-9._-]{1,100}$'
        commissionSplitPercent:
          description: Represents the percentage share of total commission allocated to the producer, used when multiple producers are associated with the policy.
          type: number
          minimum: 0
          maximum: 100
