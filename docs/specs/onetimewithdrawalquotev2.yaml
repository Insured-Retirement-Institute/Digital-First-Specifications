          enum: [FIXED, VARIABLE, INDEXED, OTHER]
        loanPrincipalDeductedAmount:
          description: The amount of the loan principal that is deducted.
          type: number
          minimum: 0
          maximum: 9999999999.99
        loanInterestDeductedAmount:
          description: The amount of the loan interest that is deducted
          type: number
          minimum: 0
          maximum: 9999999999.99
        loanPayoffIndicator:
          description: Indicator for the loan payoff
          type: boolean

    TaxWithheldAmount:
      type: object
      required: [taxWithholdingType, withholdAmount, taxId]
      properties:
        taxId:
          description: Tax Identification Number for the party (individual or entity).
          type: string
          maxLength: 9
        taxWithholdingType:
          description: Type of tax withholding.
          type: string
          enum: [FEDERAL, STATE, NRA, BACKUP]
        withholdAmount:
          description: Amount of tax withholding
          type: number
          minimum: 0
          maximum: 9999999999.99
        withheldTaxableAmount:
          description: The taxable portion of the payment that this withholding was calculated against.
          type: number
          minimum: 0
          maximum: 9999999999.99

    PayeeOrBeneficiary:
      type: object
      description: |
        The payeeOrBeneficiary object represents how the withdrawal proceeds are distributed and to whom. It includes payment form, allocation rules for each payee.
      required: [paymentForm, allocationPercentage, disbursementAmount, taxId]
      properties:
        taxId:  
          description: Tax Identification Number for the party (individual or entity).
          type: string
          maxLength: 9
        paymentForm:
          description: Mode of payment
          type: string
          enum: [DTCC, CREDITCARD, ACH, CHECK, WIRE, EXCHANGE]
        allocationPercentage:
          description: Allocation percentage.
          type: number
          minimum: 0
          maximum: 100
        disbursementAmount:
          description: The amount of the disbursement.
          type: number
          minimum: 0
          maximum: 9999999999.99

    TaxQualification:
      type: object
      description: TEFRA/TEMRA and related tax qualification fields returned with the quote.
      properties:
        isTefraApplicable:
          description: Indicates if tefra is applied.
          type: boolean
        isTemraApplicable:
          description: Indicates if temra is applied.
          type: boolean
        tefraValue:
          description: Tefra value
          type: number
          minimum: 0
          maximum: 9999999999.99
        temraValue:
          description: Temra value
          type: number
          minimum: 0
          maximum: 9999999999.99
        isirc72qPenaltyApplied:
          description: Indicates if the IRC72Q penalty is applied
          type: boolean
        taxablePortionRule:
          description: Taxable portion rule
          type: string
          enum: [LIFO, FIFO]

    Party:
      description: |
        The parties object represents the policy parties relevant to the withdrawal (owners, annuitants, beneficiaries, etc.), along with their identity, relationship, and payout instructions.
      type: object
      anyOf:
        - $ref: '#/components/schemas/IndividualParty'
        - $ref: '#/components/schemas/EntityParty'
      properties:
        paymentForm:
          description: Mode of payment
          type: string
          enum: [DTCC, CREDITCARD, ACH, CHECK, WIRE, EXCHANGE]
        allocationPercentage:
          description: Allocation percentage.
          type: number
          minimum: 0
          maximum: 100
      required:
        - paymentForm
        - allocationPercentage

    IndividualParty:
      description: Schema for individual party data
      type: object
      allOf:
        - $ref: '#/components/schemas/IndividualIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    EntityParty:
      description: Schema for entity party data
      type: object
      allOf:
        - $ref: '#/components/schemas/EntityIdentity'
        - $ref: '#/components/schemas/PartyRelationship'

    IndividualIdentity:
      description: Schema for individual identity data
      required: [firstName, lastName, taxId]
      type: object
      properties:
        type:
          description: Indicates whether the party is an individual or an entity.
          type: string
          const: individual
        firstName:
          description: First name of the individual
          type: string
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        middleName:
          description: Middle name of the individual
          type: string
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        lastName:
          description: Last name of the individual
          type: string
          minLength: 1
          maxLength: 105
          pattern: '^[a-zA-Z0-9=()*@#\s.,''_/~%$!();:&"®`\\?\-]{1,105}$'
        taxId:
          description: Tax Identification Number for the party (individual or entity).
          type: string
          maxLength: 9

    PartyRelationship:
      description: Schema for party relationship data
      type: object
      required: [relationships]
      properties:
        relationships:
          description: An array of strings specifying the relationship(s) of the party to the policy.
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [owner, jointOwner, annuitant, jointAnnuitant, primaryBeneficiary, contingentBeneficiary]

    EntityIdentity:
      description: Schema for entity identity data
      type: object
      required: [type, name, taxId]
      properties:
        type:
          description: Indicates whether the party is an individual or an entity.
          type: string
          const: entity
        name:
          description: Name of the entity
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[\w=()*@#\s.,''\/~%$!;:&"®`\\?\-]{1,100}$'
        taxId:
          description: Tax Identification Number for the party (individual or entity).
          type: string
          maxLength: 9

    RmdInfo:
      type: object
      description: RMD details specific to partial one-time withdrawals
      properties:
        rmdTaxYear:
          description: The tax year this RMD withdrawal is for (for example, 2025). Used to decide which year's RMD requirement the withdrawal is satisfying.
          type: integer
          minimum: 1900
          maximum: 2100
        rmdAgeAtDistribution:
          description: The age of the RMD owner on the distribution date, in whole years. If not sent, the carrier or platform may calculate it from date of birth.
          type: integer
          minimum: 0
          maximum: 150
        rmdSpouseDoB:
          description: The date of birth of the spouse of owner/annuitant.
          type: string
          format: date
        rmdRequestedAmount:
          description: Portion of this withdrawal that should count toward rmd for rmdTaxYear.
          type: number
          minimum: 0
          maximum: 9999999999.99
        rmdCalculationMethod:
          description: The method or IRS table used to calculate the RMD. Used mainly for audit/explanation.
          type: string
          enum: [UNIFORM_LIFETIME_TABLE, JOINT_LIFE, SINGLE_LIFE, OTHER]
        rmdPriorYearEndValue:
          description: The contract value as of 12/31 of the prior year used as the base for RMD calculation. Including this allows downstream systems to re-check or explain the RMD math.
          type: number
          minimum: 0
          maximum: 9999999999.99
        calculatedAnnualRmdAmount:
          description: The annual amount of the RMD
          type: number
          minimum: 0
          maximum: 9999999999.99
        remainingRmdAmountAfterThisQuote:
          description: The amount of RMD remaining after this quote
          type: number
          minimum: 0
          maximum: 9999999999.99
        rmdWithdrawalAmountThisYear:
          description: The RMD withdrawal amount for this current year
          type: number
          minimum: 0
          maximum: 9999999999.99
        totalRMDAmountRemaining:
          description: Remaining dollar amount that must still be withdrawn this calendar year to fully satisfy the Required Minimum Distribution.
          type: number
          minimum: 0
          maximum: 9999999999.99
      required: [rmdTaxYear, rmdRequestedAmount, rmdCalculationMethod]

    ErrorItem:
      type: object
      properties:
        errorCode:
          description: The unique code identifying the type of error
          type: string
        error:
          description: Error returned when status=FAILURE
          type: string
        errorDescription:
          description: Description of the error
          type: string

    Error:
      description: Error returned when status=FAILURE
      type: object
      properties:
        httpStatus:
          type: integer
          description: HTTP status code associated with this error
          minimum: 400
          maximum: 599
        code:
          type: string
          description: >
            A structured error code that uniquely identifies the type of error. This can follow a hierarchical format:
            - `<domain>`: The logical domain (e.g., "gateway")
            - `<category>`: The error category (e.g., "client" or "server")
            - `<subcategory>`: A specific error identifier (e.g., "badrequest", "timeout")
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred
        message:
          type: string
          description: Message with specific error details.
        validationErrors:
          type: array
          description: Logical rule violations or decision failures related to business logic or rules
          items:
            type: object
            properties:
              code:
                type: string
                description: Code to classify the error & Identifies the type of business rule or decision failure.
              message:
                type: string
                description: Why the error occurred / Specific business rule violation
      required: [code, message]
