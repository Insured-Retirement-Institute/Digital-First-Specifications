    TransactionAmountsRequest:
      type: object
      description: Details of financial amounts associated with the partial withdrawal request
      properties:
        requestedAmount:
          description: Requested amount value
          type: number
          minimum: 0
          maximum: 9999999999.99
        requestedPercentage:
          description: Requested Percentage value
          type: number
          minimum: 0
          maximum: 100
        amountType:
          description: Indicates the method used to calculate the transfer value, such as a specified dollar amount, a percentage of contract value, or a full rebalance. This value drives how amounts are specified throughout the transaction.
          type: string
          enum: [AMOUNT, PERCENTAGE, MAX, FREEWITHDRAWALAMOUNT, WITHDRAWALUNTILBASIS, EARNINGSONLY, PENALTYFREE, RIDERFREE]
        disbursementType:
          description: Type of amount for withdrawal such as Gross or Net.
          type: string
          enum: [GROSS, NET]
        disbursementPaymentForm:
          description: Type of disbursement method such as DTCC, EFT, etc.
          type: string
          enum: [DTCC, EFT, ACH, CHECK, WIRE]
      required:
        - amountType
        - disbursementType
      allOf:
        - if:
            properties:
              amountType:
                description: Indicates the method used to calculate the transfer value, such as a specified dollar amount, a percentage of contract value, or a full rebalance. This value drives how amounts are specified throughout the transaction.
                const: AMOUNT
            required:
              - amountType
          then:
            required:
              - requestedAmount
            not:
              required:
                - requestedPercentage
        - if:
            properties:
              amountType:
                description: Indicates the method used to calculate the transfer value, such as a specified dollar amount, a percentage of contract value, or a full rebalance. This value drives how amounts are specified throughout the transaction.
                const: PERCENTAGE
            required:
              - amountType
          then:
            required:
              - requestedPercentage
            not:
              required:
                - requestedAmount
        - if:
            properties:
              amountType:
                description: Indicates the method used to calculate the transfer value, such as a specified dollar amount, a percentage of contract value, or a full rebalance. This value drives how amounts are specified throughout the transaction.
                enum: [MAX, FREEWITHDRAWALAMOUNT, WITHDRAWALUNTILBASIS, EARNINGSONLY, PENALTYFREE, RIDERFREE]
            required:
              - amountType
          then:
            required: [amountType]
            not:
              anyOf:
                - required: [requestedAmount]
                - required: [requestedPercentage]

    TransactionAmountsFullRequest:
      type: object
