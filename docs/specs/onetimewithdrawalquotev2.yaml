    Bank:
      description: Financial institution details.
      type: object
      properties:
        bankId:
          description: Bank identifier.
          type: string
          maxLength: 100
        nameOnAccount:
          description: Name on the bank account.
          type: string
          maxLength: 100
        accountStatus:
          description: Status of the bank account.
          type: string
          enum: [ACTIVEBANKACCOUNT, TERMINATEDBANKACCOUNT]
        accountType:
          description: Type of the bank account.
          type: string
          enum: [CHECKING, SAVINGS, CREDITCARDACCOUNT, DEBITCARDACCOUNT, BROKERAGEACCOUNT, CERTIFICATEOFDEPOSITACCOUNT]
        accountNumber:
          description: Bank account number.
          type: string
          maxLength: 17
          pattern: '^\d{4,17}$'
        routingNumber:
          description: Routing number.
          type: string
          maxLength: 9
          pattern: '^\d{9}$'
        branchName:
          description: Branch name.
          type: string
          maxLength: 100
      required:
        - nameOnAccount
        - accountType
        - accountNumber
        - routingNumber

    TaxWithholdingInstruction:
      type: object
      description: List of tax withholding instruction entries
      properties:
        party:
          description: Common party identity fields.
          anyOf:
            - $ref: '#/components/schemas/IndividualIdentity'
            - $ref: '#/components/schemas/EntityIdentity'
        taxWithholdingType:
          description: Type of tax withholding.
          type: string
          enum: [FEDERAL, STATE, NRA, BACKUP]
        taxRateToUse:
          description: Selected tax rate source.
          type: string
          enum: [NOWITHHOLDINGELECTED, USEVALUESENTERED, NOWITHHOLDINGALLOWED, USEDEFAULTTABLE]
        filingStatus:
          description: Tax filing status.
          type: string
          enum: [SINGLE, DOMESTICPARTNERSHIP, DEFAULT, MARRIED, HEADOFHOUSEHOLD, WIDOWED, DIVORCED]
        dollar:
          type: number
          description: Fixed dollar amount to withhold
          minimum: 0
          maximum: 9999999999.99
        percentage:
          type: number
          description: Percentage amount to withhold
          minimum: 0
          maximum: 100
        taxJurisdiction:
          description: Jurisdiction for tax purposes. If taxWithholdingType=STATE this field should be mandatory.
          type: string
          maxLength: 50
      required:
        - taxWithholdingType
        - taxRateToUse
      oneOf:
        - description: Use a fixed dollar amount for withholding.
          required: [dollar]
        - description: Use a percentage for withholding.
          required: [percentage]
        - description: >
            No withholding amount required (e.g. taxRateToUse of
            NOWITHHOLDINGELECTED ,USEDEFAULTTABLE, NOWITHHOLDINGALLOWED). Neither dollar
            nor percentage is supplied.
          not:
            anyOf:
              - required: [dollar]
              - required: [percentage]
      allOf:
        - if:
            properties:
              taxWithholdingType:
                description: Type of tax withholding.
                const: STATE
          then:
            required:
              - taxJurisdiction

