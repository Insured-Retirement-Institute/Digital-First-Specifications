          maxLength: 100
        npn:
          description: National Producer Number
          type: string
          maxLength: 100
        crdNumber:
          description: The Central Registration Depository (CRD) number assigned by FINRA to identify the financial professional.
          type: string
          maxLength: 100

    FundDistribution:
      type: object
