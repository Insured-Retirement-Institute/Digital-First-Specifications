name: Setup Node and dependencies
description: >
  Sets up Node and installs npm dependencies. Shared by every job that runs a
  package script, so the Node version and install step are defined in one place
  and cannot drift between the PR checks and the Pages deploy. Callers run their
  own npm script afterwards. The caller is responsible for checking out the
  repository first.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash
