name: Build data dictionary
description: >
  Sets up Node, installs dependencies, and builds the data dictionary into ./docs.
  Shared by the PR check and the Pages deploy so the two can never drift apart.
  The caller is responsible for checking out the repository first.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Build data dictionary
      run: npm run build:dictionary
      shell: bash
